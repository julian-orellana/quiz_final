<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Quiz Final — Okeson caps. 11, 12 y 13</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --rosa:#F2A3C0;        /* fondo */
  --magenta:#D6246E;     /* errores */
  --ama:#F8DC4F;         /* aciertos y acentos */
  --verde:#1FA85C;       /* avanzar */
  --negro:#111111;
  --blanco:#FFFFFF;
  --gris:#8A8A8A;
  --sombra:6px 6px 0 var(--negro);
  --sombra-sm:4px 4px 0 var(--negro);
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{background:var(--rosa)}
body{
  font-family:Poppins,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  color:var(--negro); line-height:1.5; -webkit-font-smoothing:antialiased;
  padding:22px 16px 80px;
}
.wrap{max-width:860px;margin:0 auto}

/* ---------- cabecera durante el quiz ---------- */
#barra{display:none;margin-bottom:18px}
.hb{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:12px}
.logo{font-weight:800;font-size:18px;letter-spacing:-.01em;text-decoration:underline;
  text-underline-offset:3px;text-decoration-thickness:3px;cursor:pointer;background:none;border:0;
  font-family:inherit;color:inherit;padding:0}
.caja{border:3px solid var(--negro);box-shadow:var(--sombra-sm);background:var(--blanco);
  font-weight:700;font-size:14px;padding:6px 13px}
.caja.ok{background:var(--ama)}
.cnt{display:flex;gap:9px;margin-left:auto}
.prog{height:16px;border:3px solid var(--negro);background:var(--blanco);overflow:hidden}
.prog i{display:block;height:100%;width:0;background:var(--ama);transition:width .3s}
.pnum{font-weight:700;font-size:14px;margin-top:6px}
.regla{height:4px;background:var(--negro);margin-top:10px}

/* ---------- portada ---------- */
.titulo{text-align:center;margin:18px 0 10px}
.titulo h1{font-size:clamp(46px,12vw,92px);line-height:.88;font-weight:800;color:var(--ama);
  letter-spacing:-.02em;text-transform:uppercase;text-shadow:5px 5px 0 var(--negro)}
.titulo p{max-width:430px;margin:18px auto 0;font-weight:500;font-size:16px}
.ficha{background:var(--blanco);border:3px solid var(--negro);box-shadow:var(--sombra);
  padding:20px 22px;margin:26px auto 0;max-width:560px}
.fila{display:flex;gap:16px;padding:7px 0;align-items:flex-start}
.fila dt{font-weight:700;flex:0 0 108px;font-size:15px}
.fila dd{font-size:15px}
.centro{display:flex;justify-content:center;margin-top:26px}
.sueltos{max-width:560px;margin:34px auto 0}
.sueltos h2{font-size:13px;font-weight:700;text-transform:uppercase;letter-spacing:.09em;
  text-align:center;margin-bottom:12px}
.rejilla{display:grid;grid-template-columns:repeat(3,1fr);gap:11px}
.bloque{background:var(--blanco);border:3px solid var(--negro);box-shadow:var(--sombra-sm);
  padding:13px 11px;cursor:pointer;font:inherit;color:inherit;text-align:center;transition:.1s}
.bloque:hover{transform:translate(2px,2px);box-shadow:2px 2px 0 var(--negro)}
.bloque b{display:block;font-size:14px;font-weight:700;margin-bottom:2px}
.bloque span{font-size:12px;font-weight:500}
.bloque .ult{display:block;margin-top:5px;font-size:11px;font-weight:700;background:var(--ama);
  border:2px solid var(--negro);padding:1px 0}
.retomar{background:var(--ama);border:3px solid var(--negro);box-shadow:var(--sombra);
  padding:17px 20px;max-width:560px;margin:0 auto 24px}
.retomar b{display:block;font-size:16px;font-weight:700}
.retomar p{font-size:14px;font-weight:500;margin:3px 0 13px}
.pie{text-align:center;margin-top:28px}

/* ---------- tarjeta ---------- */
.card{background:var(--blanco);border:3px solid var(--negro);box-shadow:var(--sombra);padding:22px}
.sup{display:flex;align-items:center;gap:10px;margin-bottom:15px;flex-wrap:wrap}
.niv{background:var(--ama);border:3px solid var(--negro);font-weight:700;font-size:13px;padding:2px 11px}
.tipo{font-weight:500;font-size:14px}
.cuenta{margin-left:auto;font-weight:700;font-size:15px}
.tema{font-size:12px;font-weight:600;width:100%;margin-top:-6px}
.ctx{border:3px solid var(--negro);background:var(--rosa);padding:13px 15px;margin-bottom:15px}
.ctx b{display:block;font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.07em;margin-bottom:2px}
.ctx p{font-size:14px;font-weight:500}
.ctx p+b{margin-top:10px}
.preg{font-size:19px;font-weight:700;line-height:1.38;margin-bottom:18px}
.preg.largo{font-size:16px;font-weight:600;line-height:1.52;text-align:justify}

.ops{display:grid;gap:11px}
.ops.vf{grid-template-columns:1fr 1fr}
.op{background:var(--blanco);border:3px solid var(--negro);box-shadow:var(--sombra-sm);
  padding:14px 16px;font:inherit;font-size:15.5px;font-weight:700;color:inherit;
  cursor:pointer;text-align:left;display:flex;gap:11px;align-items:flex-start;transition:.1s}
.ops.vf .op{justify-content:center;text-align:center;font-size:17px}
.op:hover:not(:disabled){transform:translate(2px,2px);box-shadow:2px 2px 0 var(--negro)}
.op .k{flex:0 0 22px;font-weight:800}
.ops.vf .op .k{display:none}
.op.sel{background:var(--ama)}
.op:disabled{cursor:default;box-shadow:none;transform:none}
.op.apag{color:var(--gris);border-color:var(--gris)}
.op.bien{background:var(--ama);border-color:var(--negro);color:var(--negro);box-shadow:var(--sombra-sm)}
.op.mal{background:var(--blanco);border-color:var(--magenta);color:var(--magenta)}

.pista{border:3px dashed var(--negro);background:var(--rosa);padding:12px 15px;margin-top:15px;
  font-size:14.5px;font-weight:500}
.pista b{font-weight:700}

.fb{border:3px solid var(--negro);padding:16px 18px;margin-top:16px}
.fb.ok{background:var(--ama)}
.fb.no{background:var(--blanco);border-color:var(--magenta)}
.fb .t{font-size:19px;font-weight:700;margin-bottom:7px}
.fb.no .t{color:var(--magenta)}
.fb .sol{font-weight:700;font-size:15px;margin-bottom:6px}
.fb p{font-size:14.5px;font-weight:500}
.fb .pag{display:inline-block;margin-top:10px;font-size:12px;font-weight:700;
  border:2px solid var(--negro);padding:1px 8px;background:var(--blanco)}

/* ---------- botones ---------- */
.btn{font-family:inherit;font-size:16px;font-weight:700;cursor:pointer;color:var(--negro);
  border:3px solid var(--negro);box-shadow:var(--sombra);background:var(--blanco);
  padding:13px 30px;transition:.1s}
.btn:hover:not(:disabled){transform:translate(3px,3px);box-shadow:3px 3px 0 var(--negro)}
.btn:disabled{opacity:.45;cursor:not-allowed;box-shadow:var(--sombra)}
.btn-ama{background:var(--ama)}
.btn-verde{background:var(--verde);color:var(--blanco)}
.btn-ancho{width:100%;margin-top:16px;font-size:17px}
.btn-sm{font-size:14px;padding:9px 18px;box-shadow:var(--sombra-sm)}
.acc{display:flex;gap:11px;margin-top:17px;flex-wrap:wrap;align-items:center}
.acc .der{margin-left:auto}

/* ---------- resultados ---------- */
.res h2{font-size:clamp(34px,9vw,58px);font-weight:800;text-transform:uppercase;color:var(--ama);
  text-shadow:4px 4px 0 var(--negro);text-align:center;line-height:1;margin-bottom:18px}
.marcador{background:var(--blanco);border:3px solid var(--negro);box-shadow:var(--sombra);
  padding:24px;text-align:center;margin-bottom:20px}
.marcador .pct{font-size:62px;font-weight:800;line-height:1}
.marcador .ver{display:inline-block;margin-top:10px;background:var(--ama);border:3px solid var(--negro);
  font-weight:700;padding:4px 16px;font-size:15px}
.tres{display:grid;grid-template-columns:repeat(3,1fr);gap:11px;margin-bottom:24px}
.kpi{background:var(--blanco);border:3px solid var(--negro);box-shadow:var(--sombra-sm);
  padding:14px;text-align:center}
.kpi.k1{background:var(--ama)}
.kpi b{display:block;font-size:30px;font-weight:800;line-height:1.1}
.kpi span{font-size:12px;font-weight:700;text-transform:uppercase;letter-spacing:.05em}
h3.rs{font-size:14px;font-weight:700;text-transform:uppercase;letter-spacing:.08em;margin:24px 0 11px}
.tr{background:var(--blanco);border:3px solid var(--negro);padding:12px 15px;margin-bottom:9px}
.tr .l1{display:flex;align-items:center;gap:9px;margin-bottom:8px;flex-wrap:wrap}
.tr .nm{font-weight:700;font-size:14.5px}
.tr .sc{margin-left:auto;font-weight:700;font-size:14px}
.tr .et{font-size:11px;font-weight:700;text-transform:uppercase;border:2px solid var(--negro);padding:1px 7px}
.et.e1{background:var(--ama)} .et.e2{background:var(--blanco)} .et.e3{background:var(--magenta);color:#fff}
.mini{height:11px;border:2px solid var(--negro);background:var(--blanco)}
.mini i{display:block;height:100%}
.fallo{background:var(--blanco);border:3px solid var(--magenta);padding:12px 14px;margin-bottom:9px;font-size:14px;font-weight:500}
.fallo b{display:block;font-size:11.5px;font-weight:700;color:var(--magenta);text-transform:uppercase;
  letter-spacing:.04em;margin-bottom:3px}
.aviso{background:var(--blanco);border:3px solid var(--negro);padding:14px 16px;font-size:14.5px;font-weight:500}
.aviso b{font-weight:700}

@media(max-width:640px){
  .ops.vf{grid-template-columns:1fr}
  .tres{grid-template-columns:1fr}
  .rejilla{grid-template-columns:1fr}
  .fila{flex-direction:column;gap:2px}
  .fila dt{flex:none}
  .card{padding:18px}
  .preg{font-size:17.5px}
}
</style>
</head>
<body>
<div class="wrap">
  <div id="barra">
    <div class="hb">
      <button class="logo" id="bSalir">QUIZ FINAL</button>
      <div class="cnt">
        <span class="caja ok" id="cOk">Aciertos 0</span>
        <span class="caja" id="cNo">Errores 0</span>
      </div>
    </div>
    <div class="prog"><i id="prog"></i></div>
    <div class="pnum" id="pnum"></div>
    <div class="regla"></div>
  </div>
  <div id="app"></div>
</div>

<script>
/* ============================================================
   BANCO — 70 preguntas tomadas de los PDF del temario
   Okeson, Tratamiento de Oclusión y Afecciones Temporomandibulares, 7.ª ed.
   niv: 1 fácil · 2 media · 3 difícil
   ============================================================ */
const T={FA:"C11 · Analgésicos y combinaciones",
         FB:"C11 · Antiinflamatorios y corticoides",
         FC:"C11 · Relajantes, ansiolíticos y anticonvulsivos",
         FD:"C11 · Tópicos y normas de prescripción",
         C11D:"C11 · Tratamiento definitivo",C11P:"C11 · Fisioterapia y ARF",
         C12M:"C12 · Trastornos musculares",C12C:"C12 · Trastornos motores centrales",
         C13D:"C13 · Trastornos de la ATM",CASO:"Casos clínicos"};

const BANCO=[

/* ---------------- VERDADERO O FALSO (30) ----------------
   Párrafos largos al estilo del libro. En las falsas cambia UNA sola palabra. */

/* ===== Analgésicos y combinaciones ===== */
{t:"vf",niv:2,tema:T.FD,q:"Dado que muchos trastornos temporomandibulares presentan síntomas de carácter periódico o cíclico, existe la tendencia a prescribir fármacos que deben tomarse según las necesidades. Este tipo de tratamiento puede fomentar el abuso por parte del paciente y conducir a una dependencia física o psicológica, sobre todo con los analgésicos narcóticos y los ansiolíticos, que proporcionan un breve período de euforia que a veces se convierte en una recompensa inconsciente por haber sufrido dolor. Por eso se recomienda prescribir a intervalos regulares durante un período de tiempo especificado, por ejemplo 3 veces al día durante 10 días.",a:true,
 pista:"Fíjate en los dos grupos de fármacos de los que se abusa y en el ejemplo de pauta que da el libro.",
 fb:"Todo el párrafo es correcto. Al finalizar ese período se espera que el tratamiento definitivo alivie los síntomas y que la medicación deje de ser necesaria.",pg:"pp. 268-269"},

{t:"vf",niv:2,tema:T.FA,q:"Los analgésicos no opiáceos constituyen un grupo heterogéneo de compuestos que comparten determinados efectos terapéuticos y efectos secundarios, y son eficaces contra el dolor leve o moderado producido por los trastornos temporomandibulares. Uno de los primeros fármacos de elección para el alivio del dolor moderado es el paracetamol, que suele ser bien tolerado y con efectos secundarios mínimos. El prototipo de estos fármacos es el ácido acetilsalicílico, un estimulador de la síntesis de prostaglandinas, y otro salicilato es el diflunisal.",a:false,
 pista:"Repasa qué le hace exactamente la aspirina a las prostaglandinas.",
 fb:"Cambió una palabra: el ácido acetilsalicílico es un INHIBIDOR de la síntesis de prostaglandinas, no un estimulador. Lo demás del párrafo es correcto.",pg:"p. 269"},

{t:"vf",niv:3,tema:T.FA,q:"Otro tipo de analgésicos son los derivados del ácido propiónico, cuyo ejemplo es el ibuprofeno, que puede proporcionar un alivio excelente del dolor musculoesquelético; otros son el naproxeno, el ketoprofeno, la oxaprozina, el meloxicam, el etodolaco y el diclofenaco. Un efecto adverso frecuente es la irritación gastrointestinal, por lo que se recomienda tomarlos con alimentos. En los pacientes que notan gran alivio del dolor pero molestias estomacales puede añadirse un inhibidor de la bomba de protones, como el omeprazol, que aumenta la producción de ácido por parte del estómago.",a:false,
 pista:"Piensa para qué sirve un inhibidor de la bomba de protones si el problema es el ácido.",
 fb:"Cambió una palabra: el omeprazol DISMINUYE la producción de ácido por parte del estómago. El resto de la lista de fármacos y la recomendación de tomarlos con alimentos son correctas.",pg:"p. 269"},

{t:"vf",niv:3,tema:T.FA,q:"Existen varias combinaciones de analgésicos que pueden ayudar a los pacientes con trastornos temporomandibulares, basadas en el principio de que varios tipos de fármacos pueden trabajar juntos para proporcionar una mejor reducción del dolor. Un ejemplo habitual es la combinación, en un solo comprimido, de 400 mg de aspirina con 32 mg de cafeína. Otra combinación es la de 250 mg de aspirina, 250 mg de paracetamol y 65 mg de cafeína, o la de 37,5 mg de tramadol con 325 mg de paracetamol.",a:true,
 pista:"Son tres combinaciones con cifras concretas; compáralas con la tabla 11-3.",
 fb:"Las tres cifras son correctas. En la tabla, las dos primeras se pautan 1-2 comprimidos 3 veces al día con un máximo de 6 comprimidos al día, y la de tramadol 2 comprimidos cada 4-6 horas con un máximo de 8 al día.",pg:"p. 269 y tabla 11-3"},

{t:"vf",niv:3,tema:T.FA,q:"En contadas ocasiones puede que haya que utilizar analgésicos más potentes, y en tales casos se puede combinar la codeína o la hidrocodona con un salicilato o con paracetamol. Los opiáceos actúan sobre receptores específicos de los sistemas nerviosos central y periférico, presentan cualidades depresoras sobre el sistema nervioso central y posibilidad de adicción, por lo que han de prescribirse para un uso a corto plazo en los casos de dolor agudo de moderado a intenso. Están indicados los fármacos muy adictivos, como la oxicodona, el sulfato de morfina y la metadona, para el dolor musculoesquelético.",a:false,
 pista:"La última línea dice justo lo contrario de lo que el libro advierte sobre esos tres fármacos.",
 fb:"Cambió una palabra: esos fármacos están CONTRAINDICADOS para el dolor musculoesquelético. La codeína y la hidrocodona sí pueden combinarse con un salicilato o con paracetamol.",pg:"p. 269"},

{t:"vf",niv:1,tema:T.FA,q:"La eficacia de las medicaciones analgésicas puede variar mucho de un paciente a otro, porque factores como las proporciones de absorción, metabolismo y excreción varían entre pacientes y determinan la cantidad de alivio del dolor que se experimenta. Por tanto, si el clínico prueba un fármaco y el paciente no aprecia muchos resultados, debería sustituirse por otro. A menudo los pacientes son conscientes de qué fármacos les ayudan más, por lo que se les debería consultar antes de prescribir una medicación.",a:true,
 pista:"No hay cifras aquí: es el razonamiento sobre por qué un mismo analgésico no funciona igual en todos.",
 fb:"Correcto tal cual. Es la justificación de por qué el libro recomienda preguntar al paciente antes de prescribir.",pg:"p. 269"},

/* ===== Antiinflamatorios y corticoides ===== */
{t:"vf",niv:2,tema:T.FB,q:"En presencia de una lesión tisular se liberan determinados mediadores químicos en la zona lesionada, y uno de los más destacados es la prostaglandina, que excita los nociceptores locales provocando dolor. Los AINE inhiben la acción de la ciclooxigenasa, una enzima usada para sintetizar prostaglandinas a partir del ácido araquidónico. Los AINE pueden dividirse en dos grupos: los indoles, cuyo prototipo es la indometacina y que incluyen el sulindaco y la tolmetina sódica, y los derivados del ácido propiónico, de vida media más corta.",a:true,
 pista:"Mediador, enzima, sustrato y los dos grupos de AINE: compruébalos uno por uno.",
 fb:"Todo correcto. La mayoría de los AINE son también buenos analgésicos, por eso aparecen a la vez en la tabla de analgésicos y en la de antiinflamatorios.",pg:"p. 270"},

{t:"vf",niv:2,tema:T.FB,q:"Existen dos vías diferentes por las que la ciclooxigenasa interviene en la síntesis de prostaglandinas: la COX-1 y la COX-2. La vía COX-1 interviene en el mantenimiento de la función homeostática y la integridad gástrica y renal, mientras que la vía COX-2 tiene mayores efectos en la respuesta inflamatoria. La mayoría de los AINE inhiben ambas vías, reduciendo la inflamación y disminuyendo también las secreciones gástricas que protegen las paredes del estómago, de modo que el resultado suele ser reducción del dolor pero también irritación estomacal.",a:true,
 pista:"Una vía es la protectora y la otra la inflamatoria; fíjate además en cuántas vías bloquea un AINE corriente.",
 fb:"Correcto. Precisamente por inhibir también la COX-1 aparece la irritación gástrica, y de ahí nacieron los inhibidores selectivos de la COX-2.",pg:"p. 270"},

{t:"vf",niv:2,tema:T.FB,q:"Tomados de forma regular, los AINE pueden ser bastante útiles en el tratamiento de los trastornos articulares inflamatorios, así como de la mialgia crónica de mediación central. No obstante, con estos fármacos no suelen obtenerse buenos niveles en sangre inmediatamente, por lo que cuando se tomen por sus efectos antiinflamatorios han de tomarse durante un mínimo de 2 a 3 semanas. Hay que aconsejar al paciente que los tome con comida para disminuir las molestias gástricas, y si aparecen problemas estomacales puede añadirse un inhibidor de la bomba de protones.",a:true,
 pista:"El dato que más se pregunta aquí es el plazo mínimo para el efecto antiinflamatorio.",
 fb:"Correcto. Ese mínimo de 2 a 3 semanas es lo que distingue tomar un AINE como analgésico de tomarlo como antiinflamatorio.",pg:"p. 270"},

{t:"vf",niv:3,tema:T.FB,q:"Los corticoides son antiinflamatorios muy potentes que, debido a sus efectos secundarios, no se suelen prescribir para uso sistémico en el tratamiento de los trastornos temporomandibulares, y únicamente se utilizan para combatir la inflamación muscular y articular generalizada y aguda que producen las poliartritis. Un tipo de corticoide oral es la metilprednisolona, disponible en una presentación que proporciona una dosis significativa en una primera fase del tratamiento seguida de un aumento gradual de la dosis hasta la interrupción de la medicación, por ejemplo 4 mg durante 6 días.",a:false,
 pista:"Piensa cómo se retira un corticoide para evitar problemas al suspenderlo.",
 fb:"Cambió una palabra: la presentación proporciona una dosis significativa al principio seguida de una REDUCCIÓN gradual de la dosis. Es la forma más segura de usar un corticoide cuando se quiere evitar una infección secundaria tras retirar la medicación.",pg:"p. 270"},

{t:"vf",niv:1,tema:T.FC,q:"La mayoría de los relajantes musculares se han prescrito durante muchos años a pacientes con trastornos temporomandibulares, aunque la mayoría de los clínicos consideran que tienen un efecto mínimo sobre los síntomas, algo que se comprende si se considera que la mayoría de los trastornos miálgicos no se acompañan de un aumento significativo de la actividad muscular. La mayoría de los relajantes musculares tienen un efecto periférico que produce sedación en el paciente, y quizá sea esa sedación la principal explicación de la respuesta positiva de algunos pacientes.",a:false,
 pista:"Si el efecto fuera donde dice el párrafo, no produciría sedación.",
 fb:"Cambió una palabra: la mayoría de los relajantes musculares tienen un efecto CENTRAL que produce sedación. El razonamiento del principio, que los trastornos miálgicos no cursan con más actividad muscular, es correcto.",pg:"p. 271"},

{t:"vf",niv:3,tema:T.FC,q:"Experimentalmente, los relajantes musculares deprimen preferentemente los reflejos medulares polisinápticos más que los monosinápticos, y alteran la actividad neuronal asociada a los reflejos de estiramiento muscular, fundamentalmente a nivel de la zona reticular lateral del tronco del encéfalo. La metaxalona es un relajante muscular con menos efectos centrales, por lo que puede resultar más apropiado para los pacientes que tienen que trabajar mientras toman relajantes musculares. Conviene advertirles del efecto sedante y aconsejarles que no conduzcan ni manipulen maquinaria pesada.",a:true,
 pista:"Un relajante de esta lista es el indicado para quien tiene que seguir trabajando.",
 fb:"Correcto. Y el libro añade que las dosis orales de estos fármacos son muy inferiores a las necesarias para provocar experimentalmente una relajación muscular.",pg:"p. 271"},

{t:"vf",niv:3,tema:T.FC,q:"Un relajante muscular que parece influir positivamente en el dolor muscular de varias maneras, así como en los dolores debidos a trastornos temporomandibulares, es la ciclobenzaprina. Esta medicación es un compuesto similar a los antidepresivos tricíclicos y, por tanto, puede actuar de forma similar. Una dosis única de 5-10 mg antes de acostarse puede reducir el dolor muscular, especialmente por la noche. Otra dosis de 5-10 mg durante el día puede ser útil para el dolor, pero es frecuente que los pacientes indiquen que les dificulta demasiado sus actividades normales.",a:false,
 pista:"¿En qué momento del día nota el paciente el beneficio de una dosis tomada al acostarse?",
 fb:"Cambió una palabra: la dosis nocturna reduce el dolor muscular especialmente por la MAÑANA. El parecido con los antidepresivos tricíclicos y las dosis de 5-10 mg sí son correctos.",pg:"p. 271"},

{t:"vf",niv:1,tema:T.FC,q:"Cuando se piensa que son los niveles elevados de estrés emocional los que contribuyen a los trastornos temporomandibulares, los agentes ansiolíticos pueden ayudar a tratar los síntomas. Conviene recordar que los agentes ansiolíticos no eliminan el estrés, sino que simplemente modifican la percepción o la reacción del paciente frente a él, por lo que su uso constituye un tratamiento de apoyo. Un grupo de ansiolíticos utilizados habitualmente son las benzodiazepinas, entre las que se ha prestado un interés especial al diazepam.",a:true,
 pista:"La clave está en si el fármaco quita el estrés o sólo cambia cómo lo vive el paciente.",
 fb:"Correcto, y por eso los ansiolíticos son tratamiento de apoyo y no definitivo: no tocan el factor etiológico.",pg:"p. 271"},

{t:"vf",niv:3,tema:T.FC,q:"El diazepam se puede prescribir para uso diario, pero debido a su posible dependencia no debe utilizarse durante más de 7 días consecutivos. Una dosis única de 2,5-5 mg al acostarse suele ser útil para relajar la musculatura y, tal vez, disminuir la actividad parafuncional nocturna; cuando sólo se prescribe esa dosis única, la duración de su uso puede extenderse a 2 meses. Según la tabla, su dosis diaria media es de 2-5 mg dos veces al día y la máxima de 10 mg al día.",a:false,
 pista:"Compara el plazo de la dosis única con el límite que la tabla pone a todas las benzodiazepinas.",
 fb:"Cambió una palabra: con dosis única nocturna el uso puede extenderse a 2 SEMANAS, no a 2 meses. Las cifras de 7 días, 2,5-5 mg y 10 mg al día son correctas.",pg:"p. 271 y tabla 11-6"},

{t:"vf",niv:2,tema:T.FC,q:"Otras dos benzodiazepinas que se han utilizado con ciertos trastornos de los músculos masticatorios son el clonazepam y el alprazolam. Estos agentes pueden ser útiles para el tratamiento de los síntomas agudos, especialmente los relacionados con la ansiedad y, posiblemente, el bruxismo nocturno. No obstante, como sucede con el diazepam, el potencial adictivo y los efectos sedantes contraindican su uso a largo plazo en los trastornos más crónicos. Ambos comparten una dosis diaria máxima de 4 mg y el límite de no más de 14 días.",a:true,
 pista:"Las tres benzodiazepinas de la tabla comparten un límite de días; sólo una tiene un máximo distinto.",
 fb:"Correcto. El diazepam es el que tiene un máximo distinto, de 10 mg al día; clonazepam y alprazolam coinciden en 4 mg al día.",pg:"p. 271 y tabla 11-6"},

{t:"vf",niv:3,tema:T.FC,q:"Los fármacos anticonvulsivos se han utilizado tradicionalmente para las crisis de gran mal y pequeño mal asociadas con la epilepsia, y se cree que estabilizan las membranas nerviosas haciéndolas más excitables, bajando así el ritmo de la actividad nerviosa de las células cerebrales asociadas con las crisis. Como a medida que se prolonga la experiencia dolorosa el sistema nervioso central muestra sensibilización central, el clínico puede desear utilizar alguno de estos fármacos para ayudar a disminuir ese mecanismo central.",a:false,
 pista:"Si la membrana quedara así, la actividad nerviosa aumentaría en vez de bajar. El párrafo se contradice solo.",
 fb:"Cambió una palabra: los anticonvulsivos estabilizan las membranas nerviosas haciéndolas MENOS excitables. El resto, sobre la sensibilización central, es correcto.",pg:"p. 272"},

{t:"vf",niv:2,tema:T.FD,q:"Otro método para la aplicación de la medicación es a través de la piel y de las mucosas orales. Cuando la medicación se aplica tópicamente, una parte de ella puede ser absorbida por los tejidos, lo que permite su actuación en la zona dolorosa. La ventaja de esta medicación es que penetra sólo y localmente en el tejido en el que se aplica, por lo que el paciente no sufre efectos sistémicos adversos. Con trastornos dolorosos que tienen su origen en los tejidos locales puede ser útil; sin embargo, si la fuente del dolor es más periférica, este abordaje puede ser menos útil.",a:false,
 pista:"¿Qué tipo de origen del dolor es el que un fármaco aplicado en la piel no puede alcanzar?",
 fb:"Cambió una palabra: el abordaje tópico es menos útil cuando la fuente del dolor es más CENTRAL. La ventaja de no producir efectos sistémicos adversos sí es correcta.",pg:"p. 273"},

{t:"vf",niv:3,tema:T.FD,q:"La capsaicina es el ingrediente activo encontrado en los pimientos picantes y, a pesar de que produce mucho dolor, no existe evidencia de lesión tisular en la zona de aplicación. Se cree que excita una respuesta nociceptiva activando el receptor vaniloide 1 en la sinapsis de la neurona de segundo orden, y que cuando estos receptores se activan repetidamente el proceso de nocicepción se atenúa. La capsaicina tópica está disponible sin receta en dos concentraciones, al 0,025% y al 0,075%, y ha de aplicarse al menos 3 veces al día durante 7-10 días.",a:true,
 pista:"Receptor, mecanismo, dos concentraciones y pauta de aplicación: todo es comprobable.",
 fb:"Todo correcto. Como los resultados no son inmediatos el paciente puede desanimarse, y por eso la capsaicina puede mezclarse con benzocaína para atenuar la experiencia dolorosa inicial.",pg:"p. 273"},

{t:"vf",niv:1,tema:T.C11D,q:"El tratamiento de apoyo va dirigido a modificar los síntomas del paciente y a menudo no tiene efecto alguno en la etiología del trastorno. Un ejemplo sencillo es administrar al paciente un comprimido de ácido acetilsalicílico para una cefalea causada por el hambre: el paciente nota alivio, pero no se modifica el factor etiológico que causa el síntoma. El clínico debe recordar siempre que el tratamiento de apoyo es sólo sintomático y, en general, no es apropiado para un tratamiento a largo plazo de los trastornos temporomandibulares.",a:true,
 pista:"El ejemplo de la cefalea por hambre es la definición misma de tratamiento de apoyo.",
 fb:"Correcto. Los dos tipos generales de tratamiento de apoyo son el tratamiento farmacológico y la fisioterapia.",pg:"p. 268"},

{t:"vf",niv:2,tema:T.C11D,q:"El tratamiento oclusal reversible modifica el estado oclusal del paciente permanentemente, y el ejemplo más habitual es el dispositivo oclusal, que se coloca sobre los dientes y modifica la posición mandibular y el contacto de los dientes. El tratamiento oclusal irreversible, en cambio, es cualquier tratamiento que altere temporalmente el estado oclusal o la posición mandibular, como el ajuste selectivo, los procedimientos de prostodoncia, la ortodoncia y la cirugía.",a:false,
 pista:"Pregúntate qué ocurre cuando el paciente se quita el dispositivo, y qué ocurre cuando le tallan un diente.",
 fb:"Están cambiadas: el reversible modifica el estado oclusal TEMPORALMENTE y el irreversible lo altera PERMANENTEMENTE. Los ejemplos que da el párrafo para cada uno sí son los correctos.",pg:"pp. 261-262"},

{t:"vf",niv:2,tema:T.C11D,q:"La revisión de los estudios a largo plazo muestra que los tratamientos conservadores y los no conservadores presentan porcentajes de éxito similares, del 70 al 85%. Como los tratamientos conservadores son reversibles y no invasivos, el principio que se desprende es que todo tratamiento inicial para los trastornos temporomandibulares debe ser conservador, reversible y no invasivo. Además, hay que recordar que los factores oclusales pueden influir por una modificación aguda del estado oclusal o por una inestabilidad ortopédica combinada con carga.",a:true,
 pista:"Son las conclusiones de las tablas 11-1 y 11-2 más la regla con la que arranca el capítulo.",
 fb:"Correcto. La simple presencia de interferencias oclusales no indica etiología, porque casi todos los individuos las tienen.",pg:"pp. 260-261"},

/* ===== Trastornos musculares y de la ATM ===== */
{t:"vf",niv:2,tema:T.C12M,q:"La cocontracción protectora es la respuesta inicial del músculo a la alteración de los estímulos sensitivos o a una lesión, y no es un trastorno patológico sino una respuesta fisiológica normal del sistema musculoesquelético. Clínicamente el paciente refiere una sensación de debilidad muscular, con dolor mínimo en reposo que aumenta con la función, y si se le pide puede alcanzar una amplitud de apertura casi normal. Esta cocontracción sólo persiste unas semanas y, si no se resuelve, es probable que aparezca el dolor muscular local.",a:false,
 pista:"Todo el párrafo describe un cuadro agudo; mira la unidad de tiempo del final.",
 fb:"Cambió una palabra: la cocontracción protectora sólo persiste unos DÍAS. Lo demás, incluida la sensación de debilidad y el dolor mínimo en reposo, es correcto.",pg:"pp. 291-292"},

{t:"vf",niv:3,tema:T.C12M,q:"El dolor muscular local es a menudo la primera respuesta del tejido muscular a una cocontracción protectora continuada, y se distingue de ella porque el paciente presenta una debilidad muscular real y dolor local a la palpación, sin poder alcanzar el rango máximo de apertura. Debe responder al tratamiento en 1 a 3 semanas, y si no lo hace hay que considerar un error diagnóstico. El riesgo de no tratarlo es que el propio dolor cree una cocontracción secundaria y se instaure un dolor muscular cíclico.",a:true,
 pista:"Lo que separa este cuadro de la cocontracción es el tipo de debilidad y el dolor a la palpación.",
 fb:"Correcto. Por eso el objetivo primario del tratamiento definitivo es reducir el estímulo sensitivo que llega al sistema nervioso central.",pg:"pp. 292-294"},

{t:"vf",niv:1,tema:T.C12M,q:"El dolor miofascial es un trastorno doloroso miógeno sistémico caracterizado por bandas duras e hipersensibles llamadas puntos gatillo, que al ser estimuladas producen dolor heterotópico. Un rasgo clínico importante es que el síntoma que refiere el paciente suele ser ese dolor referido, por ejemplo una cefalea tensional, y no el origen real del dolor, de modo que si el clínico no es cuidadoso tratará los dolores secundarios y el tratamiento fracasará.",a:false,
 pista:"¿Cuál de los trastornos miálgicos es el regional y cuál el que afecta a todo el cuerpo?",
 fb:"Cambió una palabra: el dolor miofascial es un trastorno miógeno REGIONAL. El trastorno miálgico sistémico es la fibromialgia. La descripción de los puntos gatillo y del dolor referido es correcta.",pg:"pp. 294 y 297-298"},

{t:"vf",niv:3,tema:T.C12M,q:"En la mialgia crónica de mediación central el dolor se debe fundamentalmente a efectos del sistema nervioso central que se perciben a nivel periférico, mediante una inflamación neurógena en la que las neuronas aferentes liberan en los tejidos sustancia P y bradicinina. Como el tejido ya está inflamado, hay que evitar el ejercicio y las inyecciones, y la terapia propia del dolor muscular local mejora a menudo este cuadro, lo que sirve además como dato diagnóstico.",a:false,
 pista:"El libro usa la respuesta al tratamiento como pista diagnóstica, pero en el sentido contrario al que dice el párrafo.",
 fb:"Cambió una palabra: la terapia del dolor muscular local a menudo AGRAVA la mialgia crónica de mediación central. El mecanismo de inflamación neurógena y la contraindicación de inyecciones y ejercicio sí son correctos.",pg:"pp. 300-301"},

{t:"vf",niv:1,tema:T.C11P,q:"La termoterapia se basa en la premisa de que el aumento del flujo sanguíneo en la zona favorece la curación, y reduce los síntomas creando una vasodilatación en los tejidos comprometidos que contrarresta la reducción del flujo sanguíneo. Se aplica con una toalla caliente de 10 a 15 minutos, sin superar los 30. La crioterapia, en cambio, se aplica con hielo en movimiento circular y se retira al aparecer el entumecimiento, sin permanecer sobre los tejidos más de 5 a 7 minutos.",a:true,
 pista:"Son dos tiempos distintos; comprueba cuál corresponde al calor y cuál al hielo.",
 fb:"Correcto. El calor alivia además por mecanismos de control de entrada, con fibras A-beta que enmascaran el estímulo de las fibras C.",pg:"pp. 273-274"},

{t:"vf",niv:3,tema:T.C11P,q:"La estimulación nerviosa eléctrica transcutánea emplea una corriente monofásica de alto voltaje, de intensidad reducida y frecuencia variable, cuya estimulación continua de las fibras nerviosas cutáneas produce un efecto de contraestimulación sensitiva que disminuye la percepción del dolor. Si se aumenta la intensidad hasta activar las fibras motoras, la unidad deja de servir para controlar el dolor y se comporta como una unidad de estimulación electrogalvánica.",a:false,
 pista:"Compara el tipo de corriente de la TENS con el de la estimulación electrogalvánica.",
 fb:"Cambió una palabra: la TENS emplea una corriente BIFÁSICA de bajo voltaje. La monofásica de alto voltaje es la de la estimulación electrogalvánica, que es justo en lo que se convierte si subes la intensidad.",pg:"p. 277"},

{t:"vf",niv:2,tema:T.C13D,q:"En la luxación discal sin reducción el paciente presenta una limitación de la apertura de 25 a 30 mm, con deflexión hacia el lado afectado y movimiento excéntrico normal en dirección ipsilateral pero limitado en dirección contralateral. El aparato de reposicionamiento anterior está contraindicado en este trastorno, porque sólo agravaría la situación al forzar el disco a una posición aún más avanzada.",a:true,
 pista:"Dibuja la articulación bloqueada y piensa de qué lado se pierde la traslación.",
 fb:"Correcto en los tres datos. Si el bloqueo lleva una semana o menos, la manipulación manual suele ser muy eficaz, porque el disco todavía conserva su morfología.",pg:"p. 325"},

{t:"vf",niv:3,tema:T.C13D,q:"En la luxación espontánea el cóndilo queda por delante de la eminencia y el paciente no puede cerrar la boca, lo que constituye un bloqueo abierto. El tratamiento definitivo va dirigido a disminuir el espacio discal para que la lámina retrodiscal superior pueda retraer el disco, y por eso se pide al paciente que abra del todo la boca, como al bostezar, lo que activa los músculos depresores e inhibe los elevadores.",a:false,
 pista:"Si el espacio discal está colapsado, ¿qué hay que hacer con él para que el disco vuelva a su sitio?",
 fb:"Cambió una palabra: el tratamiento va dirigido a AUMENTAR el espacio discal. La maniobra de abrir del todo la boca y el mecanismo de depresores e elevadores sí son correctos.",pg:"p. 333"},
