<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Quiz Final — Okeson caps. 11, 12 y 13</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --rosa:#F2A3C0;        /* fondo */
  --magenta:#D6246E;     /* errores */
  --ama:#F8DC4F;         /* aciertos y acentos */
  --verde:#1FA85C;       /* avanzar */
  --negro:#111111;
  --blanco:#FFFFFF;
  --gris:#8A8A8A;
  --sombra:6px 6px 0 var(--negro);
  --sombra-sm:4px 4px 0 var(--negro);
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{background:var(--rosa)}
body{
  font-family:Poppins,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  color:var(--negro); line-height:1.5; -webkit-font-smoothing:antialiased;
  padding:22px 16px 80px;
}
.wrap{max-width:860px;margin:0 auto}

/* ---------- cabecera durante el quiz ---------- */
#barra{display:none;margin-bottom:18px}
.hb{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:12px}
.logo{font-weight:800;font-size:18px;letter-spacing:-.01em;text-decoration:underline;
  text-underline-offset:3px;text-decoration-thickness:3px;cursor:pointer;background:none;border:0;
  font-family:inherit;color:inherit;padding:0}
.caja{border:3px solid var(--negro);box-shadow:var(--sombra-sm);background:var(--blanco);
  font-weight:700;font-size:14px;padding:6px 13px}
.caja.ok{background:var(--ama)}
.cnt{display:flex;gap:9px;margin-left:auto}
.prog{height:16px;border:3px solid var(--negro);background:var(--blanco);overflow:hidden}
.prog i{display:block;height:100%;width:0;background:var(--ama);transition:width .3s}
.pnum{font-weight:700;font-size:14px;margin-top:6px}
.regla{height:4px;background:var(--negro);margin-top:10px}

/* ---------- portada ---------- */
.titulo{text-align:center;margin:18px 0 10px}
.titulo h1{font-size:clamp(46px,12vw,92px);line-height:.88;font-weight:800;color:var(--ama);
  letter-spacing:-.02em;text-transform:uppercase;text-shadow:5px 5px 0 var(--negro)}
.titulo p{max-width:430px;margin:18px auto 0;font-weight:500;font-size:16px}
.ficha{background:var(--blanco);border:3px solid var(--negro);box-shadow:var(--sombra);
  padding:20px 22px;margin:26px auto 0;max-width:560px}
.fila{display:flex;gap:16px;padding:7px 0;align-items:flex-start}
.fila dt{font-weight:700;flex:0 0 108px;font-size:15px}
.fila dd{font-size:15px}
.centro{display:flex;justify-content:center;margin-top:26px}
.sueltos{max-width:560px;margin:34px auto 0}
.sueltos h2{font-size:13px;font-weight:700;text-transform:uppercase;letter-spacing:.09em;
  text-align:center;margin-bottom:12px}
.rejilla{display:grid;grid-template-columns:repeat(3,1fr);gap:11px}
.bloque{background:var(--blanco);border:3px solid var(--negro);box-shadow:var(--sombra-sm);
  padding:13px 11px;cursor:pointer;font:inherit;color:inherit;text-align:center;transition:.1s}
.bloque:hover{transform:translate(2px,2px);box-shadow:2px 2px 0 var(--negro)}
.bloque b{display:block;font-size:14px;font-weight:700;margin-bottom:2px}
.bloque span{font-size:12px;font-weight:500}
.bloque .ult{display:block;margin-top:5px;font-size:11px;font-weight:700;background:var(--ama);
  border:2px solid var(--negro);padding:1px 0}
.retomar{background:var(--ama);border:3px solid var(--negro);box-shadow:var(--sombra);
  padding:17px 20px;max-width:560px;margin:0 auto 24px}
.retomar b{display:block;font-size:16px;font-weight:700}
.retomar p{font-size:14px;font-weight:500;margin:3px 0 13px}
.pie{text-align:center;margin-top:28px}

/* ---------- tarjeta ---------- */
.card{background:var(--blanco);border:3px solid var(--negro);box-shadow:var(--sombra);padding:22px}
.sup{display:flex;align-items:center;gap:10px;margin-bottom:15px;flex-wrap:wrap}
.niv{background:var(--ama);border:3px solid var(--negro);font-weight:700;font-size:13px;padding:2px 11px}
.tipo{font-weight:500;font-size:14px}
.cuenta{margin-left:auto;font-weight:700;font-size:15px}
.tema{font-size:12px;font-weight:600;width:100%;margin-top:-6px}
.ctx{border:3px solid var(--negro);background:var(--rosa);padding:13px 15px;margin-bottom:15px}
.ctx b{display:block;font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.07em;margin-bottom:2px}
.ctx p{font-size:14px;font-weight:500}
.ctx p+b{margin-top:10px}
.preg{font-size:19px;font-weight:700;line-height:1.38;margin-bottom:18px}

.ops{display:grid;gap:11px}
.ops.vf{grid-template-columns:1fr 1fr}
.op{background:var(--blanco);border:3px solid var(--negro);box-shadow:var(--sombra-sm);
  padding:14px 16px;font:inherit;font-size:15.5px;font-weight:700;color:inherit;
  cursor:pointer;text-align:left;display:flex;gap:11px;align-items:flex-start;transition:.1s}
.ops.vf .op{justify-content:center;text-align:center;font-size:17px}
.op:hover:not(:disabled){transform:translate(2px,2px);box-shadow:2px 2px 0 var(--negro)}
.op .k{flex:0 0 22px;font-weight:800}
.ops.vf .op .k{display:none}
.op.sel{background:var(--ama)}
.op:disabled{cursor:default;box-shadow:none;transform:none}
.op.apag{color:var(--gris);border-color:var(--gris)}
.op.bien{background:var(--ama);border-color:var(--negro);color:var(--negro);box-shadow:var(--sombra-sm)}
.op.mal{background:var(--blanco);border-color:var(--magenta);color:var(--magenta)}

.pista{border:3px dashed var(--negro);background:var(--rosa);padding:12px 15px;margin-top:15px;
  font-size:14.5px;font-weight:500}
.pista b{font-weight:700}

.fb{border:3px solid var(--negro);padding:16px 18px;margin-top:16px}
.fb.ok{background:var(--ama)}
.fb.no{background:var(--blanco);border-color:var(--magenta)}
.fb .t{font-size:19px;font-weight:700;margin-bottom:7px}
.fb.no .t{color:var(--magenta)}
.fb .sol{font-weight:700;font-size:15px;margin-bottom:6px}
.fb p{font-size:14.5px;font-weight:500}
.fb .pag{display:inline-block;margin-top:10px;font-size:12px;font-weight:700;
  border:2px solid var(--negro);padding:1px 8px;background:var(--blanco)}

/* ---------- botones ---------- */
.btn{font-family:inherit;font-size:16px;font-weight:700;cursor:pointer;color:var(--negro);
  border:3px solid var(--negro);box-shadow:var(--sombra);background:var(--blanco);
  padding:13px 30px;transition:.1s}
.btn:hover:not(:disabled){transform:translate(3px,3px);box-shadow:3px 3px 0 var(--negro)}
.btn:disabled{opacity:.45;cursor:not-allowed;box-shadow:var(--sombra)}
.btn-ama{background:var(--ama)}
.btn-verde{background:var(--verde);color:var(--blanco)}
.btn-ancho{width:100%;margin-top:16px;font-size:17px}
.btn-sm{font-size:14px;padding:9px 18px;box-shadow:var(--sombra-sm)}
.acc{display:flex;gap:11px;margin-top:17px;flex-wrap:wrap;align-items:center}
.acc .der{margin-left:auto}

/* ---------- resultados ---------- */
.res h2{font-size:clamp(34px,9vw,58px);font-weight:800;text-transform:uppercase;color:var(--ama);
  text-shadow:4px 4px 0 var(--negro);text-align:center;line-height:1;margin-bottom:18px}
.marcador{background:var(--blanco);border:3px solid var(--negro);box-shadow:var(--sombra);
  padding:24px;text-align:center;margin-bottom:20px}
.marcador .pct{font-size:62px;font-weight:800;line-height:1}
.marcador .ver{display:inline-block;margin-top:10px;background:var(--ama);border:3px solid var(--negro);
  font-weight:700;padding:4px 16px;font-size:15px}
.tres{display:grid;grid-template-columns:repeat(3,1fr);gap:11px;margin-bottom:24px}
.kpi{background:var(--blanco);border:3px solid var(--negro);box-shadow:var(--sombra-sm);
  padding:14px;text-align:center}
.kpi.k1{background:var(--ama)}
.kpi b{display:block;font-size:30px;font-weight:800;line-height:1.1}
.kpi span{font-size:12px;font-weight:700;text-transform:uppercase;letter-spacing:.05em}
h3.rs{font-size:14px;font-weight:700;text-transform:uppercase;letter-spacing:.08em;margin:24px 0 11px}
.tr{background:var(--blanco);border:3px solid var(--negro);padding:12px 15px;margin-bottom:9px}
.tr .l1{display:flex;align-items:center;gap:9px;margin-bottom:8px;flex-wrap:wrap}
.tr .nm{font-weight:700;font-size:14.5px}
.tr .sc{margin-left:auto;font-weight:700;font-size:14px}
.tr .et{font-size:11px;font-weight:700;text-transform:uppercase;border:2px solid var(--negro);padding:1px 7px}
.et.e1{background:var(--ama)} .et.e2{background:var(--blanco)} .et.e3{background:var(--magenta);color:#fff}
.mini{height:11px;border:2px solid var(--negro);background:var(--blanco)}
.mini i{display:block;height:100%}
.fallo{background:var(--blanco);border:3px solid var(--magenta);padding:12px 14px;margin-bottom:9px;font-size:14px;font-weight:500}
.fallo b{display:block;font-size:11.5px;font-weight:700;color:var(--magenta);text-transform:uppercase;
  letter-spacing:.04em;margin-bottom:3px}
.aviso{background:var(--blanco);border:3px solid var(--negro);padding:14px 16px;font-size:14.5px;font-weight:500}
.aviso b{font-weight:700}

@media(max-width:640px){
  .ops.vf{grid-template-columns:1fr}
  .tres{grid-template-columns:1fr}
  .rejilla{grid-template-columns:1fr}
  .fila{flex-direction:column;gap:2px}
  .fila dt{flex:none}
  .card{padding:18px}
  .preg{font-size:17.5px}
}
</style>
</head>
<body>
<div class="wrap">
  <div id="barra">
    <div class="hb">
      <button class="logo" id="bSalir">QUIZ FINAL</button>
      <div class="cnt">
        <span class="caja ok" id="cOk">Aciertos 0</span>
        <span class="caja" id="cNo">Errores 0</span>
      </div>
    </div>
    <div class="prog"><i id="prog"></i></div>
    <div class="pnum" id="pnum"></div>
    <div class="regla"></div>
  </div>
  <div id="app"></div>
</div>

<script>
/* ============================================================
   BANCO — 50 preguntas tomadas de los PDF del temario
   Okeson, Tratamiento de Oclusión y Afecciones Temporomandibulares, 7.ª ed.
   niv: 1 fácil · 2 media · 3 difícil
   ============================================================ */
const T={C11D:"C11 · Tratamiento definitivo",C11F:"C11 · Farmacología",C11P:"C11 · Fisioterapia y ARF",
         C12M:"C12 · Trastornos musculares",C12C:"C12 · Trastornos motores centrales",
         C13D:"C13 · Trastornos de la ATM",CASO:"Casos clínicos"};

const BANCO=[

/* ---------------- VERDADERO O FALSO (20) ---------------- */
{t:"vf",niv:1,tema:T.C12M,q:"La cocontracción protectora no es un trastorno patológico, sino una respuesta fisiológica normal del sistema musculoesquelético.",a:true,
 pista:"Pregúntate si el SNC está fallando o si está protegiendo una zona amenazada.",
 fb:"Aparece así en el texto. Por eso el tratamiento no se dirige al músculo en sí, sino al motivo de la cocontracción.",pg:"p. 291"},

{t:"vf",niv:2,tema:T.C12M,q:"La cocontracción protectora sólo persiste unas <em>semanas</em>; si no se resuelve es probable que persista el dolor muscular local.",a:false,
 pista:"Revisa la unidad de tiempo: ¿es un cuadro agudo de días o de semanas?",
 fb:"Cambió una palabra: la cocontracción protectora sólo persiste unos DÍAS, no semanas. El resto de la frase sí es correcto.",pg:"p. 291"},

{t:"vf",niv:2,tema:T.C12M,q:"En el dolor muscular local existe una debilidad muscular real, mientras que en la cocontracción protectora el paciente sólo experimenta una sensación de debilidad.",a:true,
 pista:"Compara punto por punto las características clínicas de los dos trastornos.",
 fb:"Es uno de los datos que más se preguntan. Añade que en la cocontracción el paciente puede alcanzar una amplitud casi normal si se le pide, y en el dolor muscular local no.",pg:"pp. 291 y 293"},

{t:"vf",niv:2,tema:T.C12M,q:"En el mioespasmo el dolor en reposo es <em>mínimo</em>.",a:false,
 pista:"Es uno de los datos que separa el mioespasmo de la cocontracción y del dolor muscular local.",
 fb:"Cambió una palabra: en el mioespasmo EXISTE dolor en reposo. El dolor mínimo en reposo corresponde a la cocontracción protectora y al dolor muscular local.",pg:"p. 296"},

{t:"vf",niv:1,tema:T.C12M,q:"El dolor miofascial es un trastorno doloroso miógeno <em>sistémico</em> caracterizado por bandas duras e hipersensibles llamadas puntos gatillo.",a:false,
 pista:"¿Cuál de los trastornos miálgicos es el sistémico y cuál el regional?",
 fb:"Cambió una palabra: el dolor miofascial es REGIONAL. El trastorno miálgico sistémico es la fibromialgia.",pg:"pp. 294 y 297"},

{t:"vf",niv:2,tema:T.C12M,q:"En el dolor miofascial el síntoma que refiere el paciente suele ser el dolor heterotópico y no el origen real del dolor.",a:true,
 pista:"El paciente dirige al clínico hacia la cefalea tensional, no hacia el punto gatillo.",
 fb:"Si el clínico no es cuidadoso tratará los dolores secundarios y el tratamiento fracasará.",pg:"p. 298"},

{t:"vf",niv:3,tema:T.C12M,q:"La terapia que se usa para el dolor muscular local <em>mejora</em> a menudo la mialgia crónica de mediación central.",a:false,
 pista:"El texto lo usa como pista diagnóstica: si tratas un dolor muscular local y empeora…",
 fb:"Cambió una palabra: esa terapia a menudo AGRAVA la mialgia crónica de mediación central. Si los síntomas empeoran con ella, es probable que el trastorno sea en realidad una mialgia de mediación central.",pg:"p. 301"},

{t:"vf",niv:3,tema:T.C12M,q:"En la mialgia crónica de mediación central están indicadas las inyecciones de anestésico local en el músculo doloroso.",a:false,
 pista:"El tejido ya tiene inflamación neurógena. ¿Qué le hace una aguja?",
 fb:"Hay que EVITAR el ejercicio y las inyecciones, porque causan traumatismo en tejidos ya inflamados. Tras metabolizarse el anestésico el dolor suele aumentar, y ese comportamiento ayuda al diagnóstico.",pg:"p. 301"},

{t:"vf",niv:1,tema:T.C12C,q:"La fuerza aplicada sobre los dientes durante el apretamiento diurno es mucho menor que la asociada al bruxismo del sueño, por lo que se espera un daño dental menor.",a:true,
 pista:"Por eso el desgaste dental es típico de uno y no del otro.",
 fb:"Menos desgaste, movilidad y fracturas. Pero sí puede producir dolor muscular, por la contracción constante sin períodos de descanso.",pg:"p. 306"},

{t:"vf",niv:1,tema:T.C12C,q:"La distonía oromandibular es una distonía <em>generalizada</em> en la que se producen espasmos repetitivos de los músculos masticatorios, faciales o linguales.",a:false,
 pista:"Distingue entre las distonías que afectan a muchos grupos musculares y las que afectan sólo a grupos concretos.",
 fb:"Cambió una palabra: la distonía oromandibular es FOCAL. Las generalizadas afectan a muchos grupos musculares.",pg:"p. 306"},

{t:"vf",niv:1,tema:T.C12C,q:"La toxina botulínica no relaja los músculos permanentemente, por lo que no puede considerarse un tratamiento definitivo.",a:true,
 pista:"¿Elimina la etiología o sólo el efecto?",
 fb:"Por eso los trastornos miálgicos agudos, como la cocontracción protectora y el dolor muscular local, no son candidatos a toxina botulínica.",pg:"p. 307"},

{t:"vf",niv:1,tema:T.C11D,q:"El tratamiento oclusal irreversible es cualquier tratamiento que altere permanentemente el estado oclusal y/o la posición mandibular.",a:true,
 pista:"Piensa qué pasa cuando el paciente se quita un dispositivo, y qué pasa cuando le tallas un diente.",
 fb:"Ajuste selectivo, restauraciones que modifican la oclusión, ortodoncia y cirugía. El reversible, en cambio, modifica el estado oclusal sólo TEMPORALMENTE: al retirar el dispositivo se restablece la situación preexistente.",pg:"pp. 261-262"},

{t:"vf",niv:2,tema:T.C11D,q:"Los tratamientos conservadores y los no conservadores presentan porcentajes de éxito similares a largo plazo, del 70 al 85%.",a:true,
 pista:"Es la conclusión de las tablas 11-1 y 11-2, y la base de toda la filosofía de tratamiento.",
 fb:"De ahí el principio: todo tratamiento inicial debe ser conservador, reversible y no invasivo.",pg:"p. 260"},

{t:"vf",niv:3,tema:T.C11F,q:"El diazepam puede prescribirse para uso diario, pero por su posible dependencia no debe utilizarse más de 7 días consecutivos.",a:true,
 pista:"Hay un matiz: si es dosis única nocturna, el plazo cambia.",
 fb:"Con dosis única de 2,5-5 mg al acostarse, el uso puede extenderse a 2 semanas.",pg:"p. 271"},

{t:"vf",niv:3,tema:T.C11F,q:"La vía <em>COX-1</em> tiene mayores efectos sobre la respuesta inflamatoria.",a:false,
 pista:"Una vía protege el estómago y el riñón; la otra es la inflamatoria.",
 fb:"Cambió un número: es la vía COX-2 la que tiene mayores efectos en la respuesta inflamatoria. La COX-1 interviene en la función homeostática y en la integridad gástrica y renal.",pg:"p. 270"},

{t:"vf",niv:1,tema:T.C11P,q:"La termoterapia reduce los síntomas creando una <em>vasoconstricción</em> en los tejidos comprometidos.",a:false,
 pista:"Si el problema inicial es una reducción del flujo sanguíneo, ¿qué hace falta?",
 fb:"Cambió una palabra: el calor contrarresta la reducción del flujo sanguíneo creando VASODILATACIÓN. También alivia por mecanismos de control de entrada: fibras A-beta que enmascaran el estímulo de las fibras C.",pg:"p. 273"},

{t:"vf",niv:2,tema:T.C11P,q:"En la crioterapia el hielo no debe permanecer sobre los tejidos durante más de 5-7 minutos.",a:true,
 pista:"Ojo con no mezclar este tiempo con el del calor húmedo.",
 fb:"Se retira cuando empieza el entumecimiento, y nunca más allá de 5-7 minutos. El calor húmedo es distinto: 10-15 minutos, sin superar los 30.",pg:"pp. 273-274"},

{t:"vf",niv:3,tema:T.C11P,q:"La TENS emplea una corriente <em>monofásica de alto voltaje</em>, intensidad reducida y frecuencia variable.",a:false,
 pista:"Compara la TENS con la estimulación electrogalvánica.",
 fb:"La TENS emplea corriente BIFÁSICA de BAJO voltaje. La monofásica de alto voltaje es la de la estimulación electrogalvánica. De hecho, si subes la intensidad de la TENS hasta activar las fibras motoras, se convierte en una unidad de estimulación electrogalvánica.",pg:"p. 277"},

{t:"vf",niv:2,tema:T.C13D,q:"En la luxación discal sin reducción el aparato de reposicionamiento anterior está contraindicado.",a:true,
 pista:"¿Hacia dónde empujaría ese aparato a un disco ya luxado por delante?",
 fb:"Sólo agravaría el trastorno al forzar el disco a una posición aún más avanzada.",pg:"p. 325"},

{t:"vf",niv:3,tema:T.C13D,q:"En la luxación espontánea el tratamiento definitivo va dirigido a <em>disminuir</em> el espacio discal para que la lámina retrodiscal superior retraiga el disco.",a:false,
 pista:"Si el espacio discal está colapsado, ¿qué necesitas hacer con él?",
 fb:"Cambió una palabra: va dirigido a AUMENTAR el espacio discal. Por eso se pide al paciente que abra del todo la boca, como al bostezar, lo que activa los depresores e inhibe los elevadores.",pg:"p. 333"},

/* ---------------- SELECCIÓN MÚLTIPLE (20) ---------------- */
{t:"mc",niv:1,tema:T.C12M,q:"¿Cuáles son los cinco tipos de trastornos de los músculos masticatorios que describe el capítulo 12?",
 o:["Cocontracción protectora, dolor muscular local, dolor miofascial, mioespasmo y mialgia crónica de mediación central",
    "Cocontracción protectora, dolor muscular local, dolor miofascial, fibromialgia y bruxismo del sueño",
    "Mioespasmo, dolor miofascial, miositis, fibromialgia y distonía oromandibular",
    "Dolor muscular local, mialgia de mediación central, fibromialgia, apretamiento diurno y bruxismo"],c:0,
 pista:"La fibromialgia y los trastornos motores centrales se comentan aparte, no forman parte de esos cinco.",
 fb:"El texto añade por separado otros dos grupos: los trastornos motores de mediación central y la fibromialgia.",pg:"p. 291"},

{t:"mc",niv:2,tema:T.C12M,q:"En el tratamiento definitivo del dolor muscular local, ¿cuál es el objetivo primario?",
 o:["Reducir el estímulo sensitivo (el dolor) que llega al SNC",
    "Relajar farmacológicamente los músculos elevadores contraídos",
    "Restablecer de inmediato la amplitud máxima de apertura con ejercicios",
    "Corregir la inestabilidad ortopédica mediante ajuste oclusal"],c:0,
 pista:"El riesgo del dolor muscular local es que acabe generando un dolor muscular cíclico.",
 fb:"Se trata de cortar la entrada de estímulo doloroso al SNC, porque ese dolor crea cocontracción secundaria y con el tiempo dolor muscular cíclico.",pg:"p. 293"},

{t:"mc",niv:3,tema:T.C12M,q:"¿Por qué los relajantes musculares son poco útiles en el dolor muscular local?",
 o:["Porque los músculos realmente no se están contrayendo: no hay una lectura mayor en el EMG",
    "Porque no atraviesan la barrera hematoencefálica y no alcanzan el músculo",
    "Porque el dolor muscular local es de origen inflamatorio y requiere AINE",
    "Porque producen un efecto rebote que aumenta la actividad parafuncional nocturna"],c:0,
 pista:"Piensa en lo que mide un electromiograma en este trastorno.",
 fb:"Pueden relajar y sedar centralmente, pero no hay contracción que relajar. Por eso deberían emplearse muy poco, advirtiendo de la somnolencia.",pg:"p. 296"},

{t:"mc",niv:2,tema:T.C12M,q:"Un mioespasmo persistente no cede con hielo ni con masaje. Según el algoritmo, el siguiente paso es:",
 o:["Inyectar un anestésico local en el músculo afectado",
    "Colocar un aparato de reposicionamiento anterior durante la noche",
    "Iniciar ultrasonidos y estimulación electrogalvánica tres veces por semana",
    "Prescribir gabapentina para reducir la sensibilización central"],c:0,
 pista:"El algoritmo tiene dos salidas: reducción del espasmo o no reducción.",
 fb:"Si no hay reducción del espasmo se inyecta lidocaína al 2% sin vasoconstrictor en el músculo afectado. Y si el mioespasmo es crónico o repetido, hay que considerar distonía oromandibular y toxina botulínica.",pg:"pp. 296-297 y fig. 12-7"},

{t:"mc",niv:3,tema:T.C12M,q:"¿Cuál de estos NO figura entre los factores etiológicos del dolor miofascial?",
 o:["Inestabilidad ortopédica combinada con carga articular",
    "Presencia de alteraciones del sueño",
    "Factores locales como hábitos, postura, distensiones o enfriamiento",
    "Factores sistémicos como carencias nutricionales, fatiga o infecciones víricas"],c:0,
 pista:"Uno de ellos es el mecanismo típico de las alteraciones discales del capítulo 13.",
 fb:"La inestabilidad ortopédica con carga es etiología de alteraciones discales. La lista del dolor miofascial es: dolor profundo constante, estrés emocional, alteraciones del sueño, factores locales, factores sistémicos y mecanismo idiopático de puntos gatillo.",pg:"p. 298"},

{t:"mc",niv:3,tema:T.C12M,q:"Pauta de ibuprofeno que indica el texto en la mialgia crónica de mediación central:",
 o:["600 mg cuatro veces al día durante 2 semanas",
    "400 mg tres veces al día durante 5-7 días",
    "800 mg dos veces al día durante 10 días",
    "600 mg cada 8 horas según las necesidades"],c:0,
 pista:"Insiste en que las dosis «según las necesidades» no sirven aquí.",
 fb:"Pauta regular, para que las concentraciones en sangre sean suficientes. Las dosis irregulares no logran el efecto.",pg:"p. 301"},

{t:"mc",niv:1,tema:T.C12C,q:"¿Cuál es el primer objetivo del tratamiento del apretamiento diurno?",
 o:["La consciencia cognitiva: que el paciente se dé cuenta de que lo hace",
    "Colocar un aparato de estabilización de uso diurno",
    "Prescribir un ansiolítico durante las horas de trabajo",
    "Realizar un ajuste oclusal que elimine los contactos prematuros"],c:0,
 pista:"La respuesta inicial de la mayoría de los pacientes es «yo no hago eso».",
 fb:"Primero la consciencia cognitiva, y después la posición de reposo: labios relajados, lengua en el suelo de la boca y dientes separados. Un estudio mostró que esta técnica era más eficaz que un dispositivo oclusal para disminuir el dolor muscular.",pg:"p. 306"},

{t:"mc",niv:2,tema:T.C12C,q:"Sobre el estado oclusal y el bruxismo del sueño, el texto concluye que:",
 o:["El estado oclusal ejerce sólo una pequeña influencia; el estrés emocional parece influir más",
    "La maloclusión es la causa principal, y el ajuste oclusal selectivo reduce el bruxismo",
    "El bruxismo desaparece de forma permanente con el uso prolongado de dispositivos oclusales",
    "El bruxismo del sueño responde bien a la educación del paciente y la biorretroalimentación"],c:0,
 pista:"Hubo una época en que se creía otra cosa; los estudios bien controlados la corrigieron.",
 fb:"El ajuste oclusal no reduce el bruxismo. Los dispositivos sí reducen la actividad muscular nocturna a corto plazo, pero no lo curan: al suspenderlos, reaparece.",pg:"p. 305"},

{t:"mc",niv:1,tema:T.C11D,q:"¿Cuáles son los cinco factores etiológicos cuyo tratamiento definitivo analiza el capítulo 11?",
 o:["Factores oclusales, estrés emocional, traumatismos, estímulos dolorosos profundos y actividad parafuncional",
    "Factores oclusales, inestabilidad ortopédica, bruxismo, traumatismos y alteraciones del sueño",
    "Estrés emocional, depresión, trastornos del sueño, postura y actividad parafuncional",
    "Macrotraumatismos, microtraumatismos, dolor profundo, maloclusión y apretamiento"],c:0,
 pista:"Son los mismos cinco que el capítulo 7 identifica como etiología de los TTM.",
 fb:"Y la regla que cierra el apartado: todo tratamiento inicial debe ser conservador, reversible y no invasivo.",pg:"p. 261"},

{t:"mc",niv:2,tema:T.C11D,q:"¿Cómo puede influir la oclusión en los TTM, según el capítulo 11?",
 o:["Por un cambio agudo del estado oclusal y por inestabilidad ortopédica combinada con carga",
    "Únicamente por la presencia de interferencias oclusales",
    "Por la pérdida de dimensión vertical y por la posición condílea retruida",
    "Por el desgaste dental y la hipermovilidad articular"],c:0,
 pista:"El texto insiste en que casi todos los individuos tienen interferencias oclusales.",
 fb:"La simple presencia de interferencias no indica etiología: hace falta una modificación aguda del estado oclusal o una inestabilidad ortopédica importante con carga.",pg:"p. 261"},

{t:"mc",niv:2,tema:T.C11D,q:"Ante un macrotraumatismo ya ocurrido que ha producido lesión tisular, el tratamiento:",
 o:["Sólo puede ser de apoyo, porque la etiología ya no está presente",
    "Es definitivo, mediante un aparato de reposicionamiento anterior",
    "Es definitivo, mediante ajuste oclusal para dar estabilidad ortopédica",
    "Debe ser quirúrgico si hay dolor articular asociado"],c:0,
 pista:"Compara macrotraumatismo con microtraumatismo: en uno la causa persiste y en el otro no.",
 fb:"En el macrotraumatismo el tratamiento definitivo no tiene relevancia porque el traumatismo dejó de actuar; sí cabe la prevención, con protector bucal en deportistas. En el microtraumatismo sí hay tratamiento definitivo: crear condiciones de carga favorables.",pg:"p. 267"},

{t:"mc",niv:3,tema:T.C11F,q:"Dosis diaria máxima de ibuprofeno según la tabla de analgésicos:",
 o:["3.200 mg/día","1.500 mg/día","2.400 mg/día","4 g/día"],c:0,
 pista:"La dosis media es de 400-800 mg dos o tres veces al día.",
 fb:"Ojo con las vecinas de la tabla: naproxeno 1.500 mg/día durante 3-5 días, y paracetamol y ácido acetilsalicílico 4 g/día.",pg:"tabla 11-3, p. 269"},

{t:"mc",niv:3,tema:T.C11F,q:"Dosis diaria máxima de diazepam en la tabla de ansiolíticos:",
 o:["10 mg/día, no más de 14 días","4 mg/día, no más de 14 días","20 mg/día durante 7 días","5 mg/día sin límite de tiempo"],c:0,
 pista:"Clonazepam y alprazolam comparten otra cifra máxima distinta.",
 fb:"Diazepam 10 mg/día, con dosis media de 2-5 mg dos veces al día. Clonazepam y alprazolam tienen máximo de 4 mg/día, también con el límite de 14 días.",pg:"tabla 11-6, p. 271"},

{t:"mc",niv:2,tema:T.C11F,q:"¿Qué tiene de particular la ciclobenzaprina entre los relajantes musculares?",
 o:["Es un compuesto similar a los antidepresivos tricíclicos y puede actuar de forma parecida",
    "Es el único que no produce sedación, por lo que permite conducir",
    "Actúa directamente sobre la placa motora del músculo masetero",
    "Es un inhibidor selectivo de la COX-2 con efecto miorrelajante"],c:0,
 pista:"Por eso una dosis nocturna reduce especialmente el dolor matinal.",
 fb:"Una dosis única de 5-10 mg antes de acostarse puede reducir el dolor muscular, sobre todo por la mañana. El relajante con menos efectos centrales, apto para quien debe trabajar, es la metaxalona.",pg:"p. 271"},

{t:"mc",niv:2,tema:T.C11P,q:"¿Qué modalidad introduce medicación en los tejidos mediante una corriente eléctrica baja aplicada sobre una almohadilla?",
 o:["Iontoforesis","Fonoforesis","Estimulación electrogalvánica","TENS"],c:0,
 pista:"Su «hermana» hace lo mismo pero con ultrasonidos.",
 fb:"La fonoforesis administra el fármaco con ultrasonidos, por ejemplo crema de hidrocortisona al 10%. En iontoforesis se usan sobre todo anestésicos locales y antiinflamatorios.",pg:"p. 275"},

{t:"mc",niv:3,tema:T.C11P,q:"¿De cuántos componentes de aprendizaje y entrenamiento consta el método de autorregulación física (ARF)?",
 o:["Ocho","Cuatro","Cinco","Diez"],c:0,
 pista:"No lo confundas con las características de los pacientes con dolor orofacial muscular ni con los ejes del abordaje.",
 fb:"Ocho componentes, desde explicar el trastorno hasta la higiene del sueño y la información sobre líquidos, nutrición y ejercicio. Cinco son las características de estos pacientes y cuatro los focos del abordaje de Bertrand y Carlson.",pg:"p. 280"},

{t:"mc",niv:2,tema:T.C13D,q:"¿Cuáles son las causas más frecuentes de microtraumatismo en las alteraciones discales?",
 o:["Las lesiones de hipoxia-reperfusión, el bruxismo y la inestabilidad ortopédica",
    "Los accidentes de tráfico, los golpes en la cara y las intubaciones",
    "La apertura excesiva, las inyecciones y el uso desacostumbrado del músculo",
    "Las adherencias, las adhesiones y la condromalacia"],c:0,
 pista:"Son los mecanismos que el paciente no identifica en la historia clínica.",
 fb:"Los macrotraumatismos sí suelen identificarse en la historia clínica; los microtraumatismos pasan desapercibidos.",pg:"p. 317"},

{t:"mc",niv:3,tema:T.C13D,q:"Según los estudios a largo plazo, ¿en qué porcentaje de pacientes reducen los aparatos de reposicionamiento anterior los síntomas dolorosos del desplazamiento y la luxación discal con reducción?",
 o:["75%","28%","66%","43%"],c:0,
 pista:"Las otras cifras son: el éxito si se exige eliminar también los ruidos, los pacientes que seguían con ruidos y la recidiva con prótesis fijas.",
 fb:"En el mismo estudio el 66% seguía con ruidos articulares y sólo el 25% con dolor; si se exigiera eliminar dolor y ruidos, el éxito bajaría al 28%.",pg:"pp. 319-320"},

{t:"mc",niv:3,tema:T.C13D,q:"¿Por qué puede aparecer una mordida abierta posterior con el aparato de reposicionamiento anterior?",
 o:["Por contractura miostática reversible del pterigoideo lateral inferior, proporcional al tiempo de uso",
    "Por intrusión de los molares bajo la presión del aparato",
    "Por reabsorción condílea secundaria a la carga en protrusión",
    "Por expansión del disco articular reposicionado"],c:0,
 pista:"Por eso la filosofía actual es reducir al máximo el tiempo de uso.",
 fb:"Se revierte convirtiendo el aparato en uno de estabilización o reduciendo progresivamente su uso. El texto cita otras dos explicaciones posibles: contractura miofibrótica e inestabilidad ortopédica previa.",pg:"pp. 321-322 y 324"},

{t:"mc",niv:2,tema:T.C13D,q:"Cuando el macrotraumatismo es el factor etiológico principal, ¿de qué depende el éxito y la duración del tratamiento con aparato?",
 o:["Carácter agudo de la lesión, extensión de la lesión, edad del paciente y salud general",
    "Tipo de maloclusión, grado de desplazamiento discal, sexo y hábitos parafuncionales",
    "Tiempo de uso diario, material del aparato, altura oclusal y guía canina",
    "Grado de apertura máxima, presencia de clic, dolor a la palpación y ruidos crepitantes"],c:0,
 pista:"Son cuatro factores y todos tienen que ver con la capacidad de reparación de los tejidos.",
 fb:"Cuanto antes se trate la lesión y más joven y sano sea el paciente, mejor y más rápida será la adaptación de los tejidos retrodiscales.",pg:"pp. 323-324"},

/* ---------------- CASOS CLÍNICOS (10) ---------------- */
{t:"caso",niv:1,tema:T.CASO,
 ctx:[["Historia clínica","Vendedor de 41 años. Dolor en temporal y masetero derechos de 2 días de evolución, que empezó inmediatamente después de una obturación con amalgama. El dolor aumenta al usar los maxilares y casi desaparece al dejar de mover la boca."],
      ["Exploración","Dolor a la palpación en temporal derecho (1) y masetero derecho (2). Apertura cómoda máxima 32 mm, máxima 52 mm. ATM sin dolor ni sensibilidad. Clic derecho a los 24 mm, asintomático, presente desde hace 15 años. Marca brillante en la obturación reciente."]],
 q:"¿Cuál es el diagnóstico?",
 o:["Cocontracción protectora secundaria a la colocación de una obturación alta",
    "Dolor muscular local secundario a un traumatismo por la apertura prolongada",
    "Mioespasmo del masetero derecho por fatiga muscular",
    "Desplazamiento discal con reducción en la ATM derecha"],c:0,
 pista:"Fíjate en el tiempo transcurrido (2 días), en la apertura casi normal y en qué significa esa marca brillante.",
 fb:"El clic lleva 15 años y es asintomático: no es el problema. La clave es la alteración reciente del estímulo sensitivo con sólo 2 días de evolución. El tratamiento fue ajustar la amalgama y limitar el movimiento a la amplitud indolora.",pg:"caso 1, pp. 308-309"},

{t:"caso",niv:2,tema:T.CASO,
 ctx:[["Historia clínica","Estudiante de 19 años. Dolor muscular generalizado en el lado izquierdo de la cara que se acentúa al masticar, presente desde hace una semana. Tres episodios previos hace 2, 6 y 8 meses, todos coincidiendo con los exámenes de la universidad. Sin cambios en la oclusión."],
      ["Exploración","Dolor a la palpación en ambos maseteros (1) y temporal izquierdo (1). Manipulación funcional del pterigoideo lateral inferior izquierdo muy molesta (3). Apertura cómoda 22 mm; máxima 33 mm y dolorosa; apertura pasiva hasta 45 mm con tope blando. ATM negativa."]],
 q:"¿Cuál es el diagnóstico?",
 o:["Dolor muscular local secundario a un aumento del estrés emocional",
    "Mialgia crónica de mediación central por dolor muscular prolongado",
    "Dolor miofascial con puntos gatillo en el pterigoideo lateral",
    "Cocontracción protectora por una fuente de dolor profundo constante"],c:0,
 pista:"El tope blando en la apertura pasiva descarta un problema intracapsular. Mira el patrón de repetición de los episodios.",
 fb:"Episodios recidivantes ligados a los exámenes, una semana de evolución y ATM negativa. Se trató con consciencia del vínculo estrés-parafunción, ARF y aparato de estabilización nocturno.",pg:"caso 2, p. 309"},

{t:"caso",niv:2,tema:T.CASO,
 ctx:[["Historia clínica","Profesor de 38 años con limitación de apertura y dolor facial izquierdo de 10 días. Empezó poco después de una inyección de anestésico local; seis horas después la zona empezó a doler mucho. Los síntomas han empeorado lentamente y el dolor es máximo a primera hora de la mañana."],
      ["Exploración","Pterigoideo medial izquierdo doloroso (2); temporales dolorosos (1). Apertura máxima cómoda 26 mm. ATM negativa para dolor y disfunción. Sin signos inusuales en la zona de inyección. Radiografía panorámica normal."]],
 q:"¿Cuál es el diagnóstico?",
 o:["Dolor muscular local secundario a cocontracción prolongada por traumatismo postinyección",
    "Miositis infecciosa del pterigoideo medial por contaminación de la aguja",
    "Mioespasmo del pterigoideo medial izquierdo",
    "Trismo por hematoma en el espacio pterigomandibular"],c:0,
 pista:"No hay signos de inflamación en la zona pinchada, pero el dolor sigue y es peor al despertar.",
 fb:"El traumatismo postinyección ya se había resuelto: el dolor muscular local se había autoperpetuado como dolor muscular cíclico. Se trató con aparato de estabilización, limitación del uso, ibuprofeno 600 mg cada 8 horas, masaje y termoterapia.",pg:"caso 3, p. 309"},

{t:"caso",niv:3,tema:T.CASO,
 ctx:[["Historia clínica","Ama de casa de 36 años con dolor muy constante de 3 semanas en los músculos del lado derecho. Episodios previos similares, nunca tan intensos ni tan largos. Los síntomas se correlacionan con el estrés de cuidar a dos hijos pequeños. El dolor es máximo al despertarse."],
      ["Exploración","Dolor generalizado a la palpación de esternocleidomastoideo y temporal derecho (1); dolor intenso en masetero derecho (3). Apertura cómoda máxima 18 mm. ATM sin dolor ni disfunción. Faltan los dos primeros molares mandibulares, con los segundos desviados hacia el espacio y desviación lateral de RC a máxima intercuspidación."]],
 q:"¿Cuál es el diagnóstico?",
 o:["Mialgia crónica de mediación central secundaria a un dolor muscular local prolongado",
    "Dolor muscular local por inestabilidad ortopédica tras la pérdida de los molares",
    "Dolor miofascial con punto gatillo en el masetero derecho",
    "Fibromialgia con síntomas masticatorios secundarios"],c:0,
 pista:"Tres semanas de dolor constante, apertura de 18 mm y episodios previos: el cuadro ya se ha cronificado.",
 fb:"El tratamiento incluyó ARF, aparato de estabilización nocturno, tratamiento del estrés con psicólogo y ultrasonidos. Recién resueltos los síntomas se abordó la oclusión: enderezamiento ortodóncico y reposición de los primeros molares con implantes.",pg:"caso 4, pp. 309-310"},

{t:"caso",niv:3,tema:T.CASO,
 ctx:[["Historia clínica","Secretaria de 27 años con tensión en los músculos mandibulares y cefalea constante bilateral en las sienes desde hace 4 meses, peor tras un día entero con el ordenador. La tensión mandibular empeora al masticar, pero eso no agrava la cefalea; los movimientos y la rigidez del cuello sí la aumentan."],
      ["Exploración","Apertura cómoda 24 mm, máxima 39 mm. Sin dolor ni ruidos articulares. Dolor bilateral a la palpación en maseteros (1). Los temporales NO son dolorosos a la palpación pese a que ahí se percibe la cefalea. Múltiples puntos gatillo en músculos posteriores del cuello y trapecio: la presión sobre ellos acentúa la cefalea temporal."]],
 q:"¿Cuál es el diagnóstico?",
 o:["Dolor miofascial en cuello y trapecio con cefalea tensional referida al área temporal, más cocontracción y dolor muscular local en maseteros",
    "Mialgia de mediación central de los músculos temporales",
    "Cefalea tensional primaria sin relación con el sistema masticatorio",
    "Mioespasmo del trapecio con dolor referido a la ATM"],c:0,
 pista:"El dolor se siente donde no duele a la palpación, y duele a la palpación donde el paciente no se queja.",
 fb:"Ésa es la firma del dolor miofascial: el origen son los puntos gatillo del cuello y el trapecio, y lo que el paciente nota es el dolor heterotópico. El punto refractario del trapecio izquierdo se infiltró con 1 ml de lidocaína al 2% sin vasoconstrictor y después se distendió.",pg:"caso 5, p. 310"},

{t:"caso",niv:2,tema:T.CASO,
 ctx:[["Historia clínica","Varón de 27 años que acude de urgencia porque «se le ha quedado la boca bloqueada» desde que despertó hace 2 horas. No puede abrir bien y la mandíbula se le va hacia la izquierda. Dolor leve en reposo que aumenta mucho hacia el lado derecho al intentar cerrar los dientes. Sin antecedente de traumatismo."],
      ["Exploración","Maloclusión aguda importante con la mandíbula desplazada unos 10 mm hacia la izquierda. Mordida abierta posterior derecha de 2-3 mm con contacto fuerte en el canino izquierdo. Abre 30 mm con deflexión izquierda. La manipulación funcional desencadena dolor derecho contra resistencia. Sin ruidos articulares. Panorámica normal."]],
 q:"¿Cuál es el diagnóstico?",
 o:["Mioespasmo del pterigoideo lateral inferior derecho",
    "Luxación discal sin reducción de la ATM derecha",
    "Luxación espontánea del cóndilo derecho",
    "Dolor muscular local del masetero derecho con maloclusión funcional"],c:0,
 pista:"La maloclusión aguda con mordida abierta posterior contralateral es el sello de un músculo concreto en contracción tónica.",
 fb:"Se aplicó hielo y manipulación suave sin éxito, y después 1 ml de lidocaína al 2% sin epinefrina en el pterigoideo lateral derecho: a los 5 minutos se resolvió y se restableció la oclusión normal.",pg:"caso 6, p. 310"},

{t:"caso",niv:2,tema:T.CASO,
 ctx:[["Historia clínica","Mujer de 45 años con cefalea por toda la cabeza desde hace más de 2 meses, bilateral, irradiada por el cuello. Refiere además molestias musculares en hombros, espalda y piernas, no duerme bien, su nivel de energía es muy bajo y está deprimida. Sin traumatismo ni cambios dentales recientes."],
      ["Exploración","Numerosos sitios de dolor muscular en cabeza y cuello, pero la palpación de las áreas más sensibles NO agrava ni intensifica la cefalea. Movimiento mandibular con limitación leve (38 mm), sin ruidos ni dolor articular. Oclusión estable en posición musculoesqueléticamente estable. Panorámica sin interés."]],
 q:"¿Cuál es el diagnóstico provisional?",
 o:["Fibromialgia con síntomas masticatorios secundarios",
    "Dolor miofascial generalizado de cabeza y cuello",
    "Mialgia crónica de mediación central bilateral",
    "Cefalea tensional crónica por apretamiento diurno"],c:0,
 pista:"Compáralo con el caso del trapecio: ahí la palpación reproducía la cefalea, aquí no. Y el dolor sale de la cabeza y el cuello.",
 fb:"Dolor musculoesquelético sistémico, sueño no reparador, fatiga y depresión: el odontólogo debe identificarlo y derivar. El reumatólogo confirmó el diagnóstico; sólo se preparó un aparato de estabilización nocturno por el bruxismo.",pg:"caso 7, pp. 310-311"},

{t:"caso",niv:3,tema:T.CASO,
 ctx:[["Historia clínica","Mujer de 37 años con episodios de apertura bucal espontánea y repetida desde hace 4 años, más frecuentes en los últimos 6 meses. En un episodio tuvo un bloqueo abierto de horas y necesitó sedación en urgencias. Hace 2 años se sometió a eminectomías bilaterales que la aliviaron sólo 2 meses. Ahora los episodios recurren cada 2 o 3 semanas con mucho dolor; entre ellos hace vida normal sin dolor."],
      ["Exploración","Realizada entre episodios: sin hallazgos inusuales. Nervios craneales y evaluación cervical normales. Palpación muscular sin dolor. Movimientos mandibulares normales, aunque evita abrir del todo. Oclusión sana en posición musculoesqueléticamente estable. Eminencias articulares lisas por la cirugía previa."]],
 q:"¿Cuál es el diagnóstico y el tratamiento de elección?",
 o:["Distonía oromandibular de boca abierta; toxina botulínica en los pterigoideos laterales con guía EMG",
    "Luxación espontánea por causa anatómica; repetir la eminectomía bilateral",
    "Subluxación crónica; aparato restrictivo durante 2 meses",
    "Mioespasmo recidivante del pterigoideo lateral; inyecciones repetidas de lidocaína"],c:0,
 pista:"La cirugía anatómica ya falló y los episodios se repiten sin causa aparente. ¿Qué origen queda?",
 fb:"Bloqueos repetidos, no provocados y con exploración normal entre episodios apuntan a distonía. Se trató con gabapentina, lidocaína al 2% sin vasoconstrictor en el episodio agudo y 40 unidades de toxina botulínica A con aguja guiada por EMG; acude cada 3-4 meses a repetir la infiltración.",pg:"caso 8, p. 311"},

{t:"caso",niv:3,tema:T.CASO,
 ctx:[["Situación","Paciente con desplazamiento discal con reducción doloroso. Lleva 3 semanas con aparato de reposicionamiento anterior sólo nocturno y el dolor ha desaparecido. Se reduce el uso del aparato y a los pocos días el dolor reaparece."]],
 q:"Según el algoritmo y el texto, ¿cuáles son las dos explicaciones posibles?",
 o:["Que el tiempo de adaptación tisular no haya sido suficiente, o que exista inestabilidad ortopédica",
    "Que el disco se haya perforado, o que haya aparecido una adhesión",
    "Que exista bruxismo nocturno no controlado, o un error en el diagnóstico inicial",
    "Que el aparato esté mal ajustado, o que el paciente no lo use las horas indicadas"],c:0,
 pista:"Una explicación se resuelve con más tiempo; la otra es la única que obliga a tratamiento odontológico.",
 fb:"La primera y más frecuente es que la reparación tisular no se haya completado: se devuelve el aparato y se da más tiempo. La segunda es la falta de estabilidad ortopédica, y es la única situación que requiere tratamiento odontológico, algo que según el autor ocurre en raras ocasiones.",pg:"p. 325 y fig. 13-10"},

{t:"caso",niv:2,tema:T.CASO,
 ctx:[["Situación","Paciente con luxación discal sin reducción crónica (luxación discal permanente), sin dolor pero con disfunción: su apertura se ha mantenido limitada durante meses."]],
 q:"Según el algoritmo del capítulo 13, ¿cuál es la conducta correcta?",
 o:["Ejercicio y fisioterapia para aumentar el grado funcional de la mandíbula",
    "Aparato de reposicionamiento anterior nocturno para recapturar el disco",
    "Artrocentesis inmediata para liberar el disco luxado",
    "Aparato de estabilización 24 horas hasta recuperar la apertura"],c:0,
 pista:"Dentro del cuadro crónico, el algoritmo se bifurca según exista o no dolor.",
 fb:"Con disfunción SIN dolor: ejercicio y fisioterapia. Con disfunción CON dolor: evaluar el grado de patología y el efecto en la calidad de vida, y a partir de ahí observación con tratamiento de apoyo o considerar opciones quirúrgicas. El ARA sigue contraindicado.",pg:"fig. 13-13, p. 329"}
];

/* ============================================================
   MOTOR
   ============================================================ */
const app=document.getElementById("app"), barra=document.getElementById("barra");
const elOk=document.getElementById("cOk"), elNo=document.getElementById("cNo"),
      elPr=document.getElementById("prog"), elPn=document.getElementById("pnum"),
      elSalir=document.getElementById("bSalir");

let cola=[], i=0, buenas=0, malas=0, pistas=0, historial=[], modoActual="";
let sel=null, resuelto=false, pistaOn=false;

const NIV=["","Fácil","Media","Difícil"];
const TIPO={vf:"Verdadero o falso",mc:"Selección múltiple",caso:"Caso clínico"};
const NOMBRE={todo:"Examen completo",vf:"Verdadero o falso",mc:"Selección múltiple",caso:"Casos clínicos"};

const barajar=a=>{a=a.slice();for(let j=a.length-1;j>0;j--){const k=Math.floor(Math.random()*(j+1));[a[j],a[k]]=[a[k],a[j]]}return a};
const esc=s=>s.replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");
/* las <em> del banco marcan la palabra cambiada: sirven para el feedback y
   NUNCA se muestran en el enunciado, porque delatarían que la frase es falsa */
const limpio=s=>s.replace(/<\/?em>/g,"");
const arriba=()=>{if(window.scrollTo)window.scrollTo({top:0,behavior:"smooth"})};

/* ---------- progreso guardado ---------- */
const KEY="okeson_quiz_progreso_v2", KEY_R="okeson_quiz_resultados_v2";
function guardar(){
  try{
    if(!cola.length||i>=cola.length){localStorage.removeItem(KEY);return}
    localStorage.setItem(KEY,JSON.stringify({modo:modoActual,i,buenas,malas,pistas,
      cola:cola.map(q=>({bi:q.bi,ord:q.ord||null})),
      hist:historial.map(h=>({bi:h.bi,acierto:h.acierto})),fecha:Date.now()}));
  }catch(e){}
}
function leerProgreso(){
  try{
    const s=JSON.parse(localStorage.getItem(KEY)||"null");
    if(!s||!s.cola||!s.cola.length||s.i>=s.cola.length)return null;
    if(s.cola.some(c=>!BANCO[c.bi]))return null;
    return s;
  }catch(e){return null}
}
function borrarProgreso(){try{localStorage.removeItem(KEY)}catch(e){}}
function leerResultados(){try{return JSON.parse(localStorage.getItem(KEY_R)||"{}")}catch(e){return {}}}
function guardarResultado(pct){
  try{const r=leerResultados();r[modoActual]={pct,n:historial.length,fecha:Date.now()};
      localStorage.setItem(KEY_R,JSON.stringify(r))}catch(e){}
}
function borrarTodo(){try{localStorage.removeItem(KEY);localStorage.removeItem(KEY_R)}catch(e){}}

function prep(q,bi){
  const o=Object.assign({},q);
  o.bi = bi!==undefined ? bi : BANCO.indexOf(q);
  if(q.o){const idx=barajar(q.o.map((_,n)=>n)); o.ord=idx; o.o=idx.map(n=>q.o[n]); o.c=idx.indexOf(q.c)}
  return o;
}
function rehidratar(bi,ord){
  const q=BANCO[bi], o=Object.assign({},q); o.bi=bi;
  if(ord&&q.o){o.ord=ord; o.o=ord.map(n=>q.o[n]); o.c=ord.indexOf(q.c)}
  return o;
}
function marcador(){
  elOk.textContent="Aciertos "+buenas; elNo.textContent="Errores "+malas;
  const activo=cola.length>0;
  barra.style.display=activo?"block":"none";
  if(activo){
    elPr.style.width=((i/cola.length)*100)+"%";
    elPn.textContent="Pregunta "+Math.min(i+1,cola.length)+" de "+cola.length;
  }
}
elSalir.onclick=()=>{guardar();portada()};

/* ---------- portada ---------- */
function portada(){
  cola=[];i=0;buenas=0;malas=0;pistas=0;historial=[];marcador();
  const n=t=>BANCO.filter(q=>q.t===t).length;
  const nv=k=>BANCO.filter(q=>q.niv===k).length;
  const g=leerProgreso(), res=leerResultados();
  const ult=m=>res[m]?`<span class="ult">último ${res[m].pct}%</span>`:"";

  app.innerHTML=(g?`
  <div class="retomar">
    <b>Tienes un intento sin terminar</b>
    <p>${esc(NOMBRE[g.modo]||"Quiz")} · pregunta ${g.i+1} de ${g.cola.length} · ${g.buenas} aciertos y ${g.malas} errores</p>
    <div class="acc" style="margin-top:0">
      <button class="btn btn-verde btn-sm" id="bCont">Continuar</button>
      <button class="btn btn-sm" id="bDesc">Descartar</button>
    </div>
  </div>`:"")+`
  <div class="titulo">
    <h1>Quiz<br>Final</h1>
    <p>Tratamiento de los trastornos temporomandibulares. Okeson, capítulos 11, 12 y 13.</p>
  </div>
  <dl class="ficha">
    <div class="fila"><dt>Preguntas</dt><dd>${BANCO.length} en total</dd></div>
    <div class="fila"><dt>Formatos</dt><dd>${n("vf")} de verdadero o falso, ${n("mc")} de selección múltiple, ${n("caso")} casos clínicos</dd></div>
    <div class="fila"><dt>Niveles</dt><dd>${nv(1)} fáciles, ${nv(2)} medias, ${nv(3)} difíciles</dd></div>
    <div class="fila"><dt>Pistas</dt><dd>Disponibles en todas las preguntas</dd></div>
    <div class="fila"><dt>Progreso</dt><dd>Se guarda solo: puedes salir y continuar después</dd></div>
  </dl>
  <div class="centro"><button class="btn btn-ama" data-m="todo" style="font-size:19px;padding:15px 44px">Empezar</button></div>
  <div class="sueltos">
    <h2>O practica un bloque suelto</h2>
    <div class="rejilla">
      <button class="bloque" data-m="vf"><b>Verdadero o falso</b><span>${n("vf")} preguntas</span>${ult("vf")}</button>
      <button class="bloque" data-m="mc"><b>Selección múltiple</b><span>${n("mc")} preguntas</span>${ult("mc")}</button>
      <button class="bloque" data-m="caso"><b>Casos clínicos</b><span>${n("caso")} casos</span>${ult("caso")}</button>
    </div>
  </div>
  ${Object.keys(res).length?`<div class="pie"><button class="btn btn-sm" id="bReset">Restablecer todo el progreso</button></div>`:""}`;

  app.querySelectorAll("[data-m]").forEach(b=>b.onclick=()=>arrancar(b.dataset.m));
  if(g){
    document.getElementById("bCont").onclick=()=>continuar(g);
    document.getElementById("bDesc").onclick=()=>{borrarProgreso();portada()};
  }
  const r=document.getElementById("bReset");
  if(r)r.onclick=()=>{borrarTodo();portada()};
  arriba();
}

function arrancar(m){
  modoActual=m;
  const base=BANCO.map((q,bi)=>[q,bi]).filter(x=>m==="todo"||x[0].t===m);
  cola=base.map(x=>prep(x[0],x[1])); i=0;buenas=0;malas=0;pistas=0;historial=[];
  guardar(); pintar();
}
function continuar(s){
  modoActual=s.modo; i=s.i; buenas=s.buenas; malas=s.malas; pistas=s.pistas;
  cola=s.cola.map(c=>rehidratar(c.bi,c.ord));
  historial=s.hist.map(h=>({q:BANCO[h.bi],bi:h.bi,acierto:h.acierto}));
  pintar();
}

/* ---------- pregunta ---------- */
function pintar(){
  if(i>=cola.length)return resultados();
  sel=null;resuelto=false;pistaOn=false;
  marcador();
  const q=cola[i];
  let c="";
  if(q.ctx) c+=`<div class="ctx">${q.ctx.map(x=>`<b>${esc(x[0])}</b><p>${esc(x[1])}</p>`).join("")}</div>`;
  c+=`<div class="preg">${esc(limpio(q.q))}</div>`;
  if(q.t==="vf"){
    c+=`<div class="ops vf">
      <button class="op" data-v="1">Verdadero</button>
      <button class="op" data-v="0">Falso</button></div>`;
  }else{
    c+=`<div class="ops">${q.o.map((t,n)=>
      `<button class="op" data-v="${n}"><span class="k">${"ABCD"[n]}</span><span>${esc(t)}</span></button>`).join("")}</div>`;
  }

  app.innerHTML=`<div class="card">
    <div class="sup">
      <span class="niv">${NIV[q.niv]}</span>
      <span class="tipo">${TIPO[q.t]}</span>
      <span class="cuenta">${i+1}/${cola.length}</span>
      <span class="tema">${esc(q.tema)}</span>
    </div>
    ${c}
    <div id="zp"></div><div id="zf"></div>
    <div class="acc">
      <button class="btn btn-sm" id="bPista">Pista</button>
      <button class="btn btn-ama der" id="bOk" disabled>Comprobar</button>
    </div></div>`;

  document.getElementById("bPista").onclick=darPista;
  document.getElementById("bOk").onclick=comprobar;
  app.querySelectorAll(".op").forEach(b=>b.onclick=()=>{
    if(resuelto)return;
    app.querySelectorAll(".op").forEach(x=>x.classList.remove("sel"));
    b.classList.add("sel"); sel=+b.dataset.v;
    document.getElementById("bOk").disabled=false;
  });
  arriba();
}

function darPista(){
  if(pistaOn||resuelto)return;
  pistaOn=true;pistas++;guardar();
  document.getElementById("zp").innerHTML=`<div class="pista"><b>Pista.</b> ${esc(cola[i].pista)}</div>`;
  document.getElementById("bPista").disabled=true;
}

function comprobar(){
  if(resuelto)return; resuelto=true;
  const q=cola[i];
  const correcta = q.t==="vf" ? (q.a?1:0) : q.c;
  const acierto = sel===correcta;

  app.querySelectorAll(".op").forEach(b=>{
    b.disabled=true; const v=+b.dataset.v;
    b.classList.remove("sel");
    if(v===correcta) b.classList.add("bien");
    else if(v===sel) b.classList.add("mal");
    else b.classList.add("apag");
  });

  if(acierto)buenas++;else malas++;
  historial.push({q,bi:q.bi,acierto});
  marcador(); guardar();

  const textoCorrecta = q.t==="vf" ? (q.a?"Verdadero":"Falso") : q.o[q.c];
  document.getElementById("zf").innerHTML=`
    <div class="fb ${acierto?"ok":"no"}">
      <div class="t">${acierto?"Respuesta correcta.":"Respuesta incorrecta."}</div>
      ${acierto?"":`<div class="sol">Respuesta correcta: ${esc(textoCorrecta)}</div>`}
      <p>${esc(q.fb)}</p>
      <span class="pag">${esc(q.pg)}</span>
    </div>`;

  const b=document.getElementById("bOk"), zf=document.getElementById("zf");
  b.className="btn btn-verde btn-ancho";
  b.textContent=(i===cola.length-1)?"Ver resultados":"Continuar";
  b.onclick=()=>{i++;guardar();pintar()};
  zf.parentNode.insertBefore(b,zf);          // el botón queda ancho, encima del feedback
  const fila=app.querySelector(".acc"); if(fila)fila.style.display="none";
  b.focus({preventScroll:true});
}

/* ---------- resultados ---------- */
function resultados(){
  const tot=historial.length, pct=tot?Math.round(buenas/tot*100):0;
  borrarProgreso(); if(tot)guardarResultado(pct);
  elPr.style.width="100%"; barra.style.display="none";

  const ver = pct>=90?"Listo para el examen" : pct>=75?"Bien, con huecos concretos"
            : pct>=50?"A medio camino" : "Necesitas otra vuelta al material";

  const porTema={};
  historial.forEach(h=>{const k=h.q.tema;porTema[k]=porTema[k]||{ok:0,n:0};porTema[k].n++;if(h.acierto)porTema[k].ok++});
  const temas=Object.entries(porTema).sort((a,b)=>(a[1].ok/a[1].n)-(b[1].ok/b[1].n));

  const filas=temas.map(([nm,d])=>{
    const p=Math.round(d.ok/d.n*100);
    const e=p>=80?["e1","Dominado"]:p>=50?["e2","Repasar"]:["e3","Flojo"];
    const col=p>=80?"var(--ama)":p>=50?"var(--rosa)":"var(--magenta)";
    return `<div class="tr"><div class="l1"><span class="nm">${esc(nm)}</span>
      <span class="et ${e[0]}">${e[1]}</span><span class="sc">${d.ok}/${d.n}</span></div>
      <div class="mini"><i style="width:${p}%;background:${col}"></i></div></div>`}).join("");

  const fallos=historial.filter(h=>!h.acierto);
  const lista=fallos.length? fallos.map(h=>{
    const enun = h.q.ctx ? h.q.ctx[0][1].slice(0,90)+"… → "+h.q.q : limpio(h.q.q);
    return `<div class="fallo"><b>${esc(h.q.tema)} · ${esc(h.q.pg)}</b>${esc(enun)}</div>`}).join("")
    : `<div class="aviso">No fallaste ninguna. Repite el bloque en unos días para comprobar que se sostiene.</div>`;

  const debiles=temas.filter(([,d])=>d.ok/d.n<0.8).map(([n])=>n);
  const fuertes=temas.filter(([,d])=>d.ok/d.n>=0.8).map(([n])=>n);
  const plan = debiles.length
    ? `<div class="aviso"><b>Por dónde seguir:</b> ataca en este orden — ${debiles.slice(0,3).map(esc).join(", ")}.${
        fuertes.length?` Ya tienes sólido: ${fuertes.map(esc).join(", ")}.`:""}</div>`
    : `<div class="aviso"><b>Todos los temas en verde.</b> Repite los casos clínicos, que son los que más se olvidan.</div>`;

  app.innerHTML=`<div class="res">
    <h2>Resultados</h2>
    <div class="marcador">
      <div class="pct">${pct}%</div>
      <div class="ver">${ver}</div>
    </div>
    <div class="tres">
      <div class="kpi k1"><b>${buenas}</b><span>Aciertos</span></div>
      <div class="kpi"><b>${malas}</b><span>Errores</span></div>
      <div class="kpi"><b>${pistas}</b><span>Pistas</span></div>
    </div>
    <h3 class="rs">Rendimiento por tema</h3>${filas}
    <h3 class="rs">Qué repasar (${fallos.length})</h3>${lista}
    <h3 class="rs">Plan</h3>${plan}
    <div class="acc">
      ${fallos.length?`<button class="btn btn-verde btn-sm" id="bRe">Repetir las ${fallos.length} falladas</button>`:""}
      <button class="btn btn-ama btn-sm" id="bMismo">Repetir el bloque</button>
      <button class="btn btn-sm" id="bHome">Inicio</button>
    </div></div>`;

  if(fallos.length)document.getElementById("bRe").onclick=()=>{
    cola=fallos.map(h=>prep(h.q,h.bi));i=0;buenas=0;malas=0;pistas=0;historial=[];guardar();pintar()};
  document.getElementById("bMismo").onclick=()=>arrancar(modoActual);
  document.getElementById("bHome").onclick=portada;
  arriba();
}

/* ---------- teclado ---------- */
document.addEventListener("keydown",e=>{
  if(!cola.length)return;
  const q=cola[i]; if(!q)return;
  const bOk=document.getElementById("bOk");
  if(e.key==="Enter"&&bOk&&!bOk.disabled){e.preventDefault();bOk.click();return}
  if(resuelto)return;
  if(q.t==="vf"){
    if(e.key==="v"||e.key==="V"||e.key==="1"){const b=app.querySelector('.op[data-v="1"]');if(b)b.click()}
    if(e.key==="f"||e.key==="F"||e.key==="2"){const b=app.querySelector('.op[data-v="0"]');if(b)b.click()}
  }else if("1234".includes(e.key)){
    const b=app.querySelector(`.op[data-v="${+e.key-1}"]`); if(b)b.click();
  }
});

portada();
</script>
</body>
</html>
